<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceBreak Search</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      position: sticky;
      top: 0;
      padding: 16px 24px;
      border-bottom: 1px solid #e7e7e7;
      background: #fffffff2;
      backdrop-filter: blur(8px);
    }

    .top {
      width: min(1040px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    form {
      display: flex;
      flex: 1;
      max-width: 720px;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 13px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #777;
      box-shadow: 0 0 0 3px #0000000c;
    }

    button {
      height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 6px;
      background: #171717;
      color: #fff;
      cursor: pointer;
    }

    .page {
      width: min(900px, calc(100% - 48px));
      margin: 30px auto 80px;
    }

    .count {
      margin-bottom: 24px;
      color: #777;
      font-size: 13px;
    }

    .result {
      margin-bottom: 29px;
    }

    .result a {
      color: #174ea6;
      text-decoration: none;
      font-size: 19px;
    }

    .result a:hover {
      text-decoration: underline;
    }

    .url {
      margin: 5px 0;
      overflow: hidden;
      color: #28743b;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .description {
      max-width: 760px;
      margin: 0;
      color: #4c4c4c;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      padding: 50px 0;
      color: #777;
    }

    .loading {
      padding: 15px 0;
      color: #777;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 16px;
      }

      .top {
        gap: 12px;
      }

      .brand {
        font-size: 18px;
      }

      .page {
        width: calc(100% - 32px);
      }

      button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <a class="brand" href="index.html">TraceBreak</a>

      <form id="search">
        <input id="query" name="q" type="search" autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="page">
    <div id="count" class="count"></div>
    <div id="results" class="loading">Searching...</div>
  </main>

  <script>
    const API = "https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-search";

    const params = new URLSearchParams(location.search);
    const query = params.get("q") || "";

    const input = document.getElementById("query");
    const results = document.getElementById("results");
    const count = document.getElementById("count");

    input.value = query;

    function cleanQuery(value) {
      return value.trim().split(/\s+/).join("+");
    }

    document.getElementById("search").addEventListener("submit", event => {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        return;
      }

      location.href = "search.html?q=" + cleanQuery(value);
    });

    function addResult(item) {
      const article = document.createElement("article");
      article.className = "result";

      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = item.title || item.url;

      const url = document.createElement("div");
      url.className = "url";
      url.textContent = item.url;

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = item.description || "No description available.";

      article.append(link, url, description);
      results.appendChild(article);
    }

    async function search() {
      if (!query.trim()) {
        results.className = "empty";
        results.textContent = "Enter a search query.";
        return;
      }

      try {
        const response = await fetch(
          API + "?q=" + cleanQuery(query) + "&limit=20"
        );

        if (!response.ok) {
          throw new Error("Search failed");
        }

        const data = await response.json();

        results.textContent = "";
        results.className = "";

        if (!data.results || !data.results.length) {
          count.textContent = "No results";
          results.className = "empty";
          results.textContent = "Nothing matched that query.";
          return;
        }

        count.textContent = data.results.length + " results";

        data.results.forEach(addResult);
      } catch {
        count.textContent = "";
        results.className = "empty";
        results.textContent = "Search is temporarily unavailable.";
      }
    }

    search();
  </script>
</body>
</html>
