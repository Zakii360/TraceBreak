<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceBreak</title>
  <meta name="description" content="Trace the web, not the user.">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(680px, calc(100% - 40px));
      margin-top: -7vh;
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: -3px;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 17px;
      border: 1px solid #cfcfcf;
      border-radius: 7px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #777;
      box-shadow: 0 0 0 3px #0000000c;
    }

    button {
      height: 50px;
      padding: 0 22px;
      border: 0;
      border-radius: 7px;
      background: #171717;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #303030;
    }

    .tagline {
      margin: 18px 0 0;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>TraceBreak</h1>

    <form id="search">
      <input
        id="query"
        name="q"
        type="search"
        placeholder="Search the web"
        autocomplete="off"
        autofocus
      >
      <button type="submit">Search</button>
    </form>

    <p class="tagline">Trace the web, not the user.</p>
  </main>

  <script>
    const form = document.getElementById("search");
    const input = document.getElementById("query");

    form.addEventListener("submit", event => {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        return;
      }

      const query = value.split(/\s+/).join("+");

      location.href = "https://zakii360.github.io/TraceBreak/search?q=" + query;
    });
  </script>
</body>
</html>
