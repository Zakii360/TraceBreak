<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceBreak</title>
  <meta name="description" content="Trace the web, not the user.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #171717;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 24px;
      border-bottom: 1px solid #e7e7e7;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(10px);
    }

    .top {
      width: min(1120px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .search {
      width: min(760px, 100%);
      display: flex;
      gap: 8px;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cfcfcf;
      border-radius: 7px;
      outline: 0;
      background: #fff;
      color: #171717;
      font-size: 15px;
    }

    .search input:focus {
      border-color: #777;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, .05);
    }

    .search button {
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 7px;
      background: #171717;
      color: #fff;
      cursor: pointer;
    }

    .search button:hover {
      background: #303030;
    }

    .layout {
      width: min(1120px, calc(100% - 48px));
      margin: 30px auto 90px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 55px;
    }

    .meta {
      margin-bottom: 25px;
      color: #777;
      font-size: 13px;
    }

    .result {
      margin-bottom: 30px;
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .favicon {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex: 0 0 20px;
      border-radius: 4px;
      object-fit: contain;
    }

    .result-title {
      color: #174ea6;
      font-size: 19px;
      line-height: 1.3;
      text-decoration: none;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-url {
      margin: 5px 0 4px 30px;
      overflow: hidden;
      color: #28743b;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .description {
      max-width: 760px;
      margin: 0 0 0 30px;
      color: #4b4b4b;
      font-size: 14px;
      line-height: 1.55;
    }

    .empty {
      padding: 45px 0;
      color: #777;
      font-size: 14px;
    }

    .knowledge {
      display: none;
      align-self: start;
      border-left: 1px solid #e5e5e5;
      padding-left: 24px;
    }

    .knowledge.visible {
      display: block;
    }

    .knowledge-label {
      margin-bottom: 15px;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .knowledge-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -.6px;
    }

    .knowledge-source {
      margin: 6px 0 16px;
      color: #777;
      font-size: 12px;
    }

    .knowledge-image {
      display: block;
      width: 100%;
      max-height: 190px;
      margin-bottom: 15px;
      border-radius: 7px;
      object-fit: cover;
    }

    .knowledge-description {
      margin: 0;
      color: #444;
      font-size: 14px;
      line-height: 1.55;
    }

    .knowledge-link {
      display: inline-block;
      margin-top: 13px;
      color: #174ea6;
      font-size: 13px;
      text-decoration: none;
    }

    .knowledge-link:hover {
      text-decoration: underline;
    }

    .knowledge-block {
      margin-top: 23px;
      padding-top: 19px;
      border-top: 1px solid #e7e7e7;
    }

    .knowledge-block h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .knowledge-block p {
      margin: 0;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    .instant {
      display: none;
      margin-bottom: 30px;
      padding: 18px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      background: #fafafa;
    }

    .instant.visible {
      display: block;
    }

    .instant-label {
      margin-bottom: 8px;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .instant-value {
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -.6px;
    }

    .instant-sub {
      margin-top: 5px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .knowledge {
        border-top: 1px solid #e5e5e5;
        border-left: 0;
        padding: 25px 0 0;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 13px 16px;
      }

      .top {
        gap: 14px;
      }

      .brand {
        font-size: 18px;
      }

      .search button {
        display: none;
      }

      .layout {
        width: calc(100% - 32px);
        margin-top: 24px;
      }

      .result-url,
      .description {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <a class="brand" href="index.html">TraceBreak</a>

      <form class="search" id="search-form">
        <input
          id="query"
          name="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="layout">
    <section>
      <div class="instant" id="instant">
        <div class="instant-label" id="instant-label"></div>
        <div class="instant-value" id="instant-value"></div>
        <div class="instant-sub" id="instant-sub"></div>
      </div>

      <div class="meta" id="meta">Searching...</div>
      <div id="results"></div>
    </section>

    <aside class="knowledge" id="knowledge">
      <div class="knowledge-label">Knowledge</div>
      <div id="knowledge-content"></div>
    </aside>
  </main>

  <script>
    const SUPABASE_SEARCH =
      "https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-search-v2";

    const SUPABASE_INSTANT =
      "https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-instant-v2";

    const params = new URLSearchParams(location.search);
    const query = (params.get("q") || "")
      .replace(/\+/g, " ")
      .trim();

    const input = document.getElementById("query");
    const meta = document.getElementById("meta");
    const results = document.getElementById("results");
    const knowledge = document.getElementById("knowledge");
    const knowledgeContent =
      document.getElementById("knowledge-content");

    const instant =
      document.getElementById("instant");

    const instantLabel =
      document.getElementById("instant-label");

    const instantValue =
      document.getElementById("instant-value");

    const instantSub =
      document.getElementById("instant-sub");

    input.value = query;

    function encodeQuery(value) {
      return value
        .trim()
        .split(/\s+/)
        .join("+");
    }

    function navigate(value) {
      value = value.trim();

      if (!value) {
        return;
      }

      location.href =
        "search.html?q=" +
        encodeQuery(value);
    }

    document
      .getElementById("search-form")
      .addEventListener("submit", event => {
        event.preventDefault();
        navigate(input.value);
      });

    function faviconFor(url) {
      try {
        const parsed = new URL(url);
        const image = document.createElement("img");

        image.className = "favicon";
        image.alt = "";
        image.loading = "lazy";
        image.src =
          parsed.origin +
          "/favicon.ico";

        image.onerror = () => {
          image.remove();
        };

        return image;
      } catch {
        return null;
      }
    }

    function renderResult(item) {
      if (!item.url) {
        return;
      }

      const article =
        document.createElement("article");

      article.className = "result";

      const head =
        document.createElement("div");

      head.className = "result-head";

      const icon =
        faviconFor(item.url);

      if (icon) {
        head.appendChild(icon);
      }

      const title =
        document.createElement("a");

      title.className = "result-title";
      title.href = item.url;
      title.target = "_blank";
      title.rel =
        "noopener noreferrer";

      title.textContent =
        item.title ||
        item.url;

      head.appendChild(title);

      const url =
        document.createElement("div");

      url.className = "result-url";
      url.textContent = item.url;

      const description =
        document.createElement("p");

      description.className =
        "description";

      description.textContent =
        item.description ||
        "No description available.";

      article.appendChild(head);
      article.appendChild(url);
      article.appendChild(description);

      results.appendChild(article);
    }

    async function tracebreakSearch() {
      const endpoint =
        SUPABASE_SEARCH +
        "?q=" +
        encodeQuery(query) +
        "&limit=100";

      const response =
        await fetch(endpoint, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

      if (!response.ok) {
        throw new Error(
          "TraceBreak search failed"
        );
      }

      return response.json();
    }

    async function instantSearch() {
      const endpoint =
        SUPABASE_INSTANT +
        "?q=" +
        encodeURIComponent(query);

      const response =
        await fetch(endpoint, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

      if (!response.ok) {
        throw new Error(
          "Instant search failed"
        );
      }

      return response.json();
    }

    function showKnowledge(data) {
      if (!data) {
        return;
      }

      const wiki =
        data.wikipedia;

      const ddg =
        data.duckduckgo;

      if (
        (!wiki || !wiki.title) &&
        (!ddg || (
          !ddg.title &&
          !ddg.description
        ))
      ) {
        return;
      }

      knowledgeContent.textContent = "";

      const primary =
        wiki && wiki.title
          ? wiki
          : ddg;

      const title =
        document.createElement("h2");

      title.className =
        "knowledge-title";

      title.textContent =
        primary.title ||
        query;

      const source =
        document.createElement("div");

      source.className =
        "knowledge-source";

      source.textContent =
        wiki && wiki.title
          ? "Wikipedia"
          : "DuckDuckGo";

      knowledgeContent.appendChild(title);
      knowledgeContent.appendChild(source);

      if (primary.image) {
        const image =
          document.createElement("img");

        image.className =
          "knowledge-image";

        image.src =
          primary.image;

        image.alt = "";

        image.loading = "lazy";

        image.onerror = () => {
          image.remove();
        };

        knowledgeContent.appendChild(image);
      }

      if (primary.description) {
        const description =
          document.createElement("p");

        description.className =
          "knowledge-description";

        description.textContent =
          primary.description;

        knowledgeContent.appendChild(
          description
        );
      }

      if (primary.url) {
        const link =
          document.createElement("a");

        link.className =
          "knowledge-link";

        link.href =
          primary.url;

        link.target = "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          wiki && wiki.title
            ? "View on Wikipedia"
            : "Source";

        knowledgeContent.appendChild(
          link
        );
      }

      if (
        wiki &&
        ddg &&
        ddg.description
      ) {
        const block =
          document.createElement("div");

        block.className =
          "knowledge-block";

        const heading =
          document.createElement("h3");

        heading.textContent =
          "DuckDuckGo";

        const description =
          document.createElement("p");

        description.textContent =
          ddg.description;

        block.appendChild(heading);
        block.appendChild(
          description
        );

        if (ddg.url) {
          const link =
            document.createElement("a");

          link.className =
            "knowledge-link";

          link.href =
            ddg.url;

          link.target = "_blank";

          link.rel =
            "noopener noreferrer";

          link.textContent =
            "Source";

          block.appendChild(link);
        }

        knowledgeContent.appendChild(
          block
        );
      }

      knowledge.classList.add(
        "visible"
      );
    }

    function calculate(expression) {
      let value =
        expression
          .trim()
          .replace(/,/g, "")
          .replace(/\^/g, "**")
          .replace(/\bpi\b/gi, "Math.PI")
          .replace(/\be\b/g, "Math.E")
          .replace(/\bsqrt\s*\(/gi, "Math.sqrt(")
          .replace(/\bsin\s*\(/gi, "Math.sin(")
          .replace(/\bcos\s*\(/gi, "Math.cos(")
          .replace(/\btan\s*\(/gi, "Math.tan(")
          .replace(/\blog\s*\(/gi, "Math.log10(")
          .replace(/\bln\s*\(/gi, "Math.log(");

      if (
        !/^[0-9+\-*/().%\s_a-zA-Z*]+$/.test(value)
      ) {
        return null;
      }

      if (
        /(?:Math\.){2,}|constructor|prototype|window|document|globalThis|Function|eval|import|fetch/i.test(value)
      ) {
        return null;
      }

      try {
        const result =
          Function(
            "\"use strict\";return(" +
            value +
            ")"
          )();

        if (
          typeof result !== "number" ||
          !Number.isFinite(result)
        ) {
          return null;
        }

        return result;
      } catch {
        return null;
      }
    }

    function calculator() {
      if (
        !/^[0-9+\-*/().%^,\s]+$/.test(query)
      ) {
        return null;
      }

      return calculate(query);
    }

    function showCalculator(value) {
      instantLabel.textContent =
        "Calculator";

      instantValue.textContent =
        Number.isInteger(value)
          ? String(value)
          : String(
              Number(
                value.toPrecision(12)
              )
            );

      instantSub.textContent =
        query;

      instant.classList.add(
        "visible"
      );
    }

    function showWeather(data) {
      if (
        !data ||
        data.type !== "weather"
      ) {
        return;
      }

      instantLabel.textContent =
        "Weather";

      instantValue.textContent =
        data.temperature +
        "°F";

      instantSub.textContent =
        data.location +
        " · " +
        data.condition +
        " · Feels like " +
        data.feels_like +
        "°F · Humidity " +
        data.humidity +
        "% · Wind " +
        data.wind_mph +
        " mph";

      instant.classList.add(
        "visible"
      );
    }

    async function run() {
      if (!query) {
        meta.textContent = "";
        results.className = "empty";
        results.textContent =
          "Enter a search query.";
        return;
      }

      const calculation =
        calculator();

      if (calculation !== null) {
        showCalculator(
          calculation
        );
      }

      const weatherQuery =
        /^weather(?:\s+in)?\s+/i.test(
          query
        );

      let searchPromise =
        tracebreakSearch();

      let instantPromise =
        instantSearch();

      if (weatherQuery) {
        instantPromise =
          fetch(
            SUPABASE_INSTANT +
            "?type=weather&q=" +
            encodeURIComponent(
              query
                .replace(
                  /^weather(?:\s+in)?\s+/i,
                  ""
                )
            ),
            {
              headers: {
                "Accept":
                  "application/json"
              }
            }
          ).then(response => {
            if (!response.ok) {
              throw new Error(
                "Weather failed"
              );
            }

            return response.json();
          });
      }

      try {
        const data =
          await searchPromise;

        const list =
          Array.isArray(
            data.results
          )
            ? data.results
            : [];

        results.textContent = "";
        results.className = "";

        if (!list.length) {
          meta.textContent =
            "No indexed results";

          results.className =
            "empty";

          results.textContent =
            "TraceBreak hasn't indexed anything matching that query yet.";
        } else {
          meta.textContent =
            list.length +
            " indexed results";

          list
            .slice(0, 20)
            .forEach(
              renderResult
            );
        }
      } catch (error) {
        console.error(error);

        meta.textContent = "";
        results.className =
          "empty";

        results.textContent =
          "TraceBreak search is temporarily unavailable.";
      }

      try {
        const data =
          await instantPromise;

        if (weatherQuery) {
          showWeather(data);
        } else {
          showKnowledge(data);
        }
      } catch (error) {
        console.error(error);
      }
    }

    run();
  </script>
</body>
</html>
