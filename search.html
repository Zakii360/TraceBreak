<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceBreak</title>
<meta name="description" content="Trace the web, not the user.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:#171717;
background:#fff
}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(255,255,255,.96);
backdrop-filter:blur(14px);
border-bottom:1px solid #e7e7e7
}

.top{
width:min(1160px,calc(100% - 32px));
min-height:68px;
margin:auto;
display:flex;
align-items:center;
gap:24px
}

.logo{
color:#111;
font-size:21px;
font-weight:700;
letter-spacing:-1px;
text-decoration:none;
white-space:nowrap
}

.search{
display:flex;
flex:1;
max-width:760px
}

.search input{
width:100%;
height:42px;
padding:0 14px;
border:1px solid #ccc;
border-right:0;
border-radius:7px 0 0 7px;
outline:0;
font-size:15px
}

.search input:focus{
border-color:#777
}

.search button{
height:42px;
padding:0 19px;
border:0;
border-radius:0 7px 7px 0;
background:#171717;
color:#fff;
cursor:pointer
}

.layout{
width:min(1160px,calc(100% - 32px));
margin:26px auto 90px;
display:grid;
grid-template-columns:minmax(0,760px) 320px;
gap:55px
}

.stats{
margin-bottom:24px;
font-size:13px;
color:#777
}

.result{
margin-bottom:28px;
animation:appear .12s ease-out
}

@keyframes appear{
from{opacity:0;transform:translateY(3px)}
to{opacity:1;transform:none}
}

.resultTop{
display:flex;
align-items:flex-start;
gap:9px
}

.icon{
width:19px;
height:19px;
margin-top:3px;
border-radius:4px;
object-fit:contain;
flex:0 0 19px
}

.resultTitle{
color:#174ea6;
font-size:19px;
line-height:1.3;
text-decoration:none
}

.resultTitle:hover{
text-decoration:underline
}

.url{
margin:5px 0 4px 28px;
overflow:hidden;
color:#28743b;
font-size:13px;
text-overflow:ellipsis;
white-space:nowrap
}

.desc{
margin:0 0 0 28px;
color:#4b4b4b;
font-size:14px;
line-height:1.55
}

.panel{
display:none;
align-self:start;
border-left:1px solid #e5e5e5;
padding-left:24px
}

.panel.show{
display:block
}

.panelLabel{
margin-bottom:13px;
color:#777;
font-size:11px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase
}

.panel h2{
margin:0 0 5px;
font-size:24px;
line-height:1.2
}

.panelSource{
margin-bottom:14px;
color:#777;
font-size:12px
}

.panelImage{
display:block;
width:100%;
max-height:190px;
margin-bottom:14px;
border-radius:7px;
object-fit:cover
}

.panelText{
margin:0;
color:#444;
font-size:14px;
line-height:1.55
}

.panelLink{
display:inline-block;
margin-top:12px;
color:#174ea6;
font-size:13px;
text-decoration:none
}

.tool{
margin-bottom:18px;
padding:15px;
border:1px solid #e4e4e4;
border-radius:9px
}

.toolTitle{
margin-bottom:8px;
font-size:13px;
font-weight:700
}

.toolValue{
font-size:22px
}

.toolSmall{
margin-top:4px;
color:#666;
font-size:13px
}

.imageGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:28px
}

.imageGrid img{
width:100%;
height:110px;
border-radius:6px;
object-fit:cover
}

@media(max-width:850px){
.layout{
grid-template-columns:1fr
}

.panel{
border-top:1px solid #e5e5e5;
border-left:0;
padding:24px 0 0
}
}

@media(max-width:600px){
.top{
gap:12px
}

.logo{
font-size:18px
}

.search button{
display:none
}

.search input{
border-right:1px solid #ccc;
border-radius:7px
}

.url,.desc{
margin-left:0
}
}
</style>
</head>

<body>

<header>
<div class="top">

<a class="logo" href="/">TraceBreak</a>

<form class="search" id="searchForm">
<input
id="queryInput"
type="search"
autocomplete="off"
spellcheck="false"
>
<button type="submit">Search</button>
</form>

</div>
</header>

<main class="layout">

<section>

<div class="stats" id="stats">
Searching...
</div>

<div id="tools"></div>
<div id="images"></div>
<div id="results"></div>

</section>

<aside class="panel" id="knowledge">

<div class="panelLabel">
Knowledge
</div>

<div id="knowledgeBody"></div>

</aside>

</main>

<script>
const SUPABASE=
"https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/";

const query=
(new URLSearchParams(location.search).get("q")||"").trim();

const input=
document.getElementById("queryInput");

const stats=
document.getElementById("stats");

const results=
document.getElementById("results");

const tools=
document.getElementById("tools");

const images=
document.getElementById("images");

const panel=
document.getElementById("knowledge");

const panelBody=
document.getElementById("knowledgeBody");

const started=
performance.now();

const seen=
new Set();

input.value=
query.replace(/\+/g," ");

function encodeQuery(value){
return value
.trim()
.split(/\s+/)
.map(encodeURIComponent)
.join("+");
}

document
.getElementById("searchForm")
.addEventListener("submit",event=>{
event.preventDefault();

const value=
input.value.trim();

if(!value)return;

location.href=
"/search.html?q="+
encodeQuery(value);
});

function elapsed(){
return Math.round(
performance.now()-started
);
}

function updateStats(){
const count=
document.querySelectorAll(".result").length;

stats.textContent=
(count||0)+
(count===1?" result":" results")+
" · "+
elapsed()+
" ms";
}

function cleanSnippet(value){
if(!value)return "";

let text=
String(value)
.replace(/\s+/g," ")
.trim();

text=
text.replace(
/^(summary|highlights|notes|overview|description)\s*:\s*/i,
""
);

if(text.length>320){
text=
text.slice(0,317).trimEnd()+
"...";
}

return text;
}

function canonical(url){
try{

const u=
new URL(url);

u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid",
"dclid"
].forEach(key=>{
u.searchParams.delete(key);
});

return u.toString();

}catch{
return url;
}
}

function favicon(url){
try{

const u=
new URL(url);

const img=
document.createElement("img");

img.className="icon";
img.alt="";
img.loading="lazy";
img.src=
u.origin+
"/favicon.ico";

img.onerror=()=>{
img.remove();
};

return img;

}catch{
return null;
}
}

function addResult(item){

if(!item)return false;

const url=
item.url||
item.link||
item.href;

if(!url)return false;

const key=
canonical(url);

if(seen.has(key))return false;

seen.add(key);

const article=
document.createElement("article");

article.className="result";

const top=
document.createElement("div");

top.className="resultTop";

const icon=
item.favicon
?
document.createElement("img")
:
favicon(url);

if(icon){

icon.className="icon";
icon.alt="";
icon.loading="lazy";

if(item.favicon){
icon.src=item.favicon;

icon.onerror=()=>{
const fallback=
favicon(url);

if(fallback){
icon.replaceWith(fallback);
}else{
icon.remove();
}
};
}

top.appendChild(icon);
}

const title=
document.createElement("a");

title.className="resultTitle";
title.href=url;
title.target="_blank";
title.rel="noopener noreferrer";
title.textContent=
item.title||
item.name||
url;

top.appendChild(title);

const urlNode=
document.createElement("div");

urlNode.className="url";
urlNode.textContent=url;

const description=
document.createElement("p");

description.className="desc";

description.textContent=
cleanSnippet(
item.description||
item.snippet||
item.snippet_text||
""
);

article.append(
top,
urlNode,
description
);

results.appendChild(article);

updateStats();

return true;
}

function addResults(list){

if(!Array.isArray(list))return;

for(const item of list){
addResult(item);
}
}

function showKnowledge(data,source){

if(
!data||
(!data.title&&!data.description)
){
return;
}

panelBody.replaceChildren();

const title=
document.createElement("h2");

title.textContent=
data.title||
query;

const sourceNode=
document.createElement("div");

sourceNode.className=
"panelSource";

sourceNode.textContent=
source;

panelBody.append(
title,
sourceNode
);

if(data.image){

const image=
document.createElement("img");

image.className=
"panelImage";

image.loading="eager";
image.src=data.image;
image.alt="";

image.onerror=()=>{
image.remove();
};

panelBody.appendChild(image);
}

if(data.description){

const text=
document.createElement("p");

text.className=
"panelText";

text.textContent=
data.description;

panelBody.appendChild(text);
}

if(data.url){

const link=
document.createElement("a");

link.className=
"panelLink";

link.href=data.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent=
"Read more";

panelBody.appendChild(link);
}

panel.classList.add("show");
}

async function wikipedia(){

try{

const search=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&list=search"+
"&srsearch="+
encodeURIComponent(query)+
"&srlimit=1"+
"&format=json"+
"&origin=*";

const response=
await fetch(
search,
{cache:"no-store"}
);

if(!response.ok)return;

const data=
await response.json();

const match=
data.query?.search?.[0];

if(!match)return;

const summary=
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(match.title);

const result=
await fetch(
summary,
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!result.ok)return;

const page=
await result.json();

showKnowledge({
title:page.title,
description:page.extract,
image:
page.thumbnail?.source||
page.originalimage?.source,
url:
page.content_urls?.desktop?.page
},"Wikipedia");

}catch(error){
console.debug("Wikipedia",error);
}
}

async function duckDuckGo(){

try{

const response=
await fetch(
"https://api.duckduckgo.com/?q="+
encodeURIComponent(query)+
"&format=json"+
"&no_html=1"+
"&skip_disambig=1",
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

if(
data.AbstractText&&
!panel.classList.contains("show")
){

showKnowledge({
title:
data.Heading||
query,
description:
data.AbstractText,
image:
data.Image||
"",
url:
data.AbstractURL||
""
},"DuckDuckGo");
}

}catch(error){
console.debug("DDG",error);
}
}

function calculator(){

if(
!/^[0-9+\-*/().%\s]+$/.test(query)
)return;

try{

const value=
Function(
"\"use strict\";return("+query+")"
)();

if(!Number.isFinite(value))
return;

const box=
document.createElement("div");

box.className="tool";

const title=
document.createElement("div");

title.className="toolTitle";
title.textContent="Calculator";

const answer=
document.createElement("div");

answer.className="toolValue";
answer.textContent=
String(value);

box.append(title,answer);

tools.appendChild(box);

}catch{}
}

function conversion(){

const match=
query.match(
/^(-?[\d.,]+)\s*(km|mi|m|ft|kg|lb|c|f|°c|°f)$/i
);

if(!match)return;

const number=
Number(
match[1].replace(/,/g,"")
);

const unit=
match[2].toLowerCase();

let output="";

if(unit==="km")
output=
(number*.621371).toFixed(4)+" mi";

if(unit==="mi")
output=
(number*1.609344).toFixed(4)+" km";

if(unit==="m")
output=
(number*3.28084).toFixed(4)+" ft";

if(unit==="ft")
output=
(number*.3048).toFixed(4)+" m";

if(unit==="kg")
output=
(number*2.2046226218).toFixed(4)+" lb";

if(unit==="lb")
output=
(number*.45359237).toFixed(4)+" kg";

if(unit==="c"||unit==="°c")
output=
(number*9/5+32).toFixed(2)+" °F";

if(unit==="f"||unit==="°f")
output=
((number-32)*5/9).toFixed(2)+" °C";

if(!output)return;

const box=
document.createElement("div");

box.className="tool";

const title=
document.createElement("div");

title.className="toolTitle";
title.textContent="Conversion";

const answer=
document.createElement("div");

answer.className="toolValue";
answer.textContent=output;

box.append(title,answer);

tools.appendChild(box);
}

async function weather(){

if(
!/^\s*(weather|temperature|forecast)\b/i.test(query)
)return;

try{

const city=
query
.replace(
/^\s*(weather|temperature|forecast)\b/i,
""
)
.trim();

if(!city)return;

const geo=
await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="+
encodeURIComponent(city)+
"&count=1&language=en&format=json",
{
cache:"no-store"
}
);

if(!geo.ok)return;

const location=
await geo.json();

const place=
location.results?.[0];

if(!place)return;

const response=
await fetch(
"https://api.open-meteo.com/v1/forecast?latitude="+
place.latitude+
"&longitude="+
place.longitude+
"&current=temperature_2m,wind_speed_10m",
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

const box=
document.createElement("div");

box.className="tool";

const title=
document.createElement("div");

title.className="toolTitle";
title.textContent=
"Weather · "+
place.name;

const value=
document.createElement("div");

value.className="toolValue";
value.textContent=
data.current.temperature_2m+
"°C";

const small=
document.createElement("div");

small.className="toolSmall";

small.textContent=
"Wind "+
data.current.wind_speed_10m+
" km/h";

box.append(
title,
value,
small
);

tools.appendChild(box);

}catch(error){
console.debug("Weather",error);
}
}

async function localSearch(){

try{

const response=
await fetch(
SUPABASE+
"tracebreak-search-fast?q="+
encodeQuery(query)+
"&limit=100",
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

addResults(
data.results||
[]
);

}catch(error){
console.debug("TraceBreak",error);
}
}

async function search360(){

try{

const response=
await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=web"+
"&limit=30",
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

addResults(
data.results||
[]
);

}catch(error){
console.debug("360",error);
}
}

async function searchYou(){

try{

const response=
await fetch(
SUPABASE+
"tracebreak-meta-fast?provider=you&q="+
encodeQuery(query)+
"&limit=30",
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

const list=
data.providers?.you?.results||
[];

addResults(list);

}catch(error){
console.debug("You",error);
}
}

async function imageSearch(){

try{

const response=
await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=image"+
"&limit=12",
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

const list=
Array.isArray(data.results)
?
data.results
:
[];

if(!list.length)return;

const grid=
document.createElement("div");

grid.className="imageGrid";

for(const item of list){

const src=
item.image||
item.thumbnail;

if(!src)continue;

const image=
document.createElement("img");

image.src=src;
image.alt=
item.title||
"";
image.loading="lazy";

grid.appendChild(image);
}

if(grid.children.length){
images.appendChild(grid);
}

}catch(error){
console.debug("Images",error);
}
}

function run(){

if(!query){

stats.textContent=
"Enter a search query.";

return;
}

stats.textContent=
"Searching · "+
elapsed()+
" ms";

/*
 * Independent requests.
 * Nothing waits for another provider.
 */

localSearch();
wikipedia();
duckDuckGo();
calculator();
conversion();
weather();
search360();
imageSearch();
searchYou();
}

run();
</script>

</body>
</html>
