<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceBreak Search</title>
  <meta name="description" content="Trace the web, not the user.">

  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 15px 24px;
      border-bottom: 1px solid #e7e7e7;
      background: #fffffff2;
      backdrop-filter: blur(9px);
    }

    .top {
      width: min(1120px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .search {
      display: flex;
      width: min(720px, 100%);
      gap: 8px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    .search input:focus {
      border-color: #777;
      box-shadow: 0 0 0 3px #0000000c;
    }

    .search button {
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: #171717;
      color: #fff;
      cursor: pointer;
    }

    .search button:hover {
      background: #303030;
    }

    .layout {
      width: min(1120px, calc(100% - 48px));
      margin: 30px auto 80px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 55px;
    }

    .meta {
      margin-bottom: 25px;
      color: #777;
      font-size: 13px;
    }

    .result {
      margin-bottom: 30px;
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .favicon {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      border-radius: 4px;
      object-fit: contain;
      flex: 0 0 20px;
    }

    .result-title {
      color: #174ea6;
      font-size: 19px;
      line-height: 1.25;
      text-decoration: none;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-url {
      margin: 5px 0 4px 30px;
      overflow: hidden;
      color: #28743b;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .description {
      max-width: 760px;
      margin: 0 0 0 30px;
      color: #4c4c4c;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      padding: 45px 0;
      color: #777;
      font-size: 14px;
    }

    .knowledge {
      display: none;
      align-self: start;
      border-left: 1px solid #e5e5e5;
      padding-left: 24px;
    }

    .knowledge.visible {
      display: block;
    }

    .knowledge-label {
      margin-bottom: 16px;
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .knowledge-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -.5px;
    }

    .knowledge-source {
      margin: 6px 0 16px;
      color: #777;
      font-size: 12px;
    }

    .knowledge-image {
      display: block;
      width: 100%;
      max-height: 190px;
      margin-bottom: 16px;
      border-radius: 7px;
      object-fit: cover;
    }

    .knowledge-description {
      margin: 0;
      color: #444;
      font-size: 14px;
      line-height: 1.55;
    }

    .knowledge-link {
      display: inline-block;
      margin-top: 14px;
      color: #174ea6;
      font-size: 13px;
      text-decoration: none;
    }

    .knowledge-link:hover {
      text-decoration: underline;
    }

    .knowledge-block {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e8e8e8;
    }

    .knowledge-block-title {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .knowledge-block p {
      margin: 0;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .knowledge {
        border-top: 1px solid #e5e5e5;
        border-left: 0;
        padding: 25px 0 0;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 13px 16px;
      }

      .top {
        gap: 13px;
      }

      .brand {
        font-size: 18px;
      }

      .search button {
        display: none;
      }

      .layout {
        width: calc(100% - 32px);
        margin-top: 24px;
      }

      .result-url,
      .description {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <a class="brand" href="index.html">TraceBreak</a>

      <form class="search" id="search-form">
        <input
          id="query"
          name="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="layout">
    <section>
      <div class="meta" id="meta">Searching...</div>
      <div id="results"></div>
    </section>

    <aside class="knowledge" id="knowledge">
      <div class="knowledge-label">Knowledge</div>
      <div id="knowledge-content"></div>
    </aside>
  </main>

  <script>
    const SUPABASE_SEARCH =
      "https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-search-v2";

    const WIKIPEDIA_API =
      "https://en.wikipedia.org/api/rest_v1/page/summary/";

    const DDG_API =
      "https://api.duckduckgo.com/";

    const params = new URLSearchParams(location.search);
    const query = (params.get("q") || "").replace(/\+/g, " ").trim();

    const input = document.getElementById("query");
    const meta = document.getElementById("meta");
    const results = document.getElementById("results");
    const knowledge = document.getElementById("knowledge");
    const knowledgeContent = document.getElementById("knowledge-content");

    input.value = query;

    function encodeQuery(value) {
      return value.trim().split(/\s+/).join("+");
    }

    function navigate(value) {
      value = value.trim();

      if (!value) {
        return;
      }

      location.href = "search.html?q=" + encodeQuery(value);
    }

    document.getElementById("search-form").addEventListener(
      "submit",
      event => {
        event.preventDefault();
        navigate(input.value);
      }
    );

    function makeFavicon(url) {
      try {
        const parsed = new URL(url);
        const image = document.createElement("img");

        image.className = "favicon";
        image.alt = "";
        image.loading = "lazy";
        image.src =
          parsed.origin +
          "/favicon.ico";

        image.onerror = () => {
          image.remove();
        };

        return image;
      } catch {
        return null;
      }
    }

    function renderResult(item) {
      const article = document.createElement("article");
      article.className = "result";

      const head = document.createElement("div");
      head.className = "result-head";

      const favicon = makeFavicon(item.url);

      if (favicon) {
        head.appendChild(favicon);
      }

      const title = document.createElement("a");

      title.className = "result-title";
      title.href = item.url;
      title.target = "_blank";
      title.rel = "noopener noreferrer";
      title.textContent =
        item.title ||
        item.url;

      head.appendChild(title);

      const url = document.createElement("div");

      url.className = "result-url";
      url.textContent = item.url;

      const description = document.createElement("p");

      description.className = "description";
      description.textContent =
        item.description ||
        "No description available.";

      article.appendChild(head);
      article.appendChild(url);
      article.appendChild(description);

      results.appendChild(article);
    }

    function wikipediaSlug(value) {
      return value
        .trim()
        .replace(/\s+/g, "_");
    }

    async function wikipedia() {
      try {
        const response = await fetch(
          WIKIPEDIA_API +
          encodeURIComponent(wikipediaSlug(query)),
          {
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          return null;
        }

        const data = await response.json();

        if (
          !data.title ||
          data.type === "disambiguation"
        ) {
          return null;
        }

        return {
          title: data.title,
          description:
            data.extract ||
            "",
          image:
            data.thumbnail?.source ||
            data.originalimage?.source ||
            "",
          url:
            data.content_urls?.desktop?.page ||
            data.content_urls?.mobile?.page ||
            ""
        };
      } catch {
        return null;
      }
    }

    async function duckDuckGo() {
      try {
        const url =
          DDG_API +
          "?q=" +
          encodeURIComponent(query) +
          "&format=json" +
          "&no_html=1" +
          "&skip_disambig=1";

        const response = await fetch(url);

        if (!response.ok) {
          return null;
        }

        const data = await response.json();

        if (
          !data.AbstractText &&
          !data.Heading &&
          !data.Answer
        ) {
          return null;
        }

        return {
          title:
            data.Heading ||
            "",
          description:
            data.AbstractText ||
            data.Answer ||
            "",
          image:
            data.Image ||
            "",
          url:
            data.AbstractURL ||
            ""
        };
      } catch {
        return null;
      }
    }

    function showKnowledge(wiki, ddg) {
      if (!wiki && !ddg) {
        return;
      }

      knowledgeContent.textContent = "";

      const primary = wiki || ddg;

      const title = document.createElement("h2");
      title.className = "knowledge-title";
      title.textContent = primary.title;

      const source = document.createElement("div");
      source.className = "knowledge-source";
      source.textContent =
        wiki
          ? "Wikipedia"
          : "DuckDuckGo";

      knowledgeContent.appendChild(title);
      knowledgeContent.appendChild(source);

      if (primary.image) {
        const image = document.createElement("img");

        image.className = "knowledge-image";
        image.src = primary.image;
        image.alt = "";
        image.loading = "lazy";

        image.onerror = () => {
          image.remove();
        };

        knowledgeContent.appendChild(image);
      }

      if (primary.description) {
        const description = document.createElement("p");

        description.className =
          "knowledge-description";

        description.textContent =
          primary.description;

        knowledgeContent.appendChild(description);
      }

      if (primary.url) {
        const link = document.createElement("a");

        link.className = "knowledge-link";
        link.href = primary.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent =
          wiki
            ? "View on Wikipedia"
            : "Source";

        knowledgeContent.appendChild(link);
      }

      if (wiki && ddg && ddg.description) {
        const block = document.createElement("div");
        block.className = "knowledge-block";

        const heading = document.createElement("h3");
        heading.className =
          "knowledge-block-title";
        heading.textContent =
          "DuckDuckGo";

        const text = document.createElement("p");
        text.textContent =
          ddg.description;

        block.appendChild(heading);
        block.appendChild(text);

        if (ddg.url) {
          const link = document.createElement("a");

          link.className =
            "knowledge-link";
          link.href = ddg.url;
          link.target = "_blank";
          link.rel =
            "noopener noreferrer";
          link.textContent =
            "Source";

          block.appendChild(link);
        }

        knowledgeContent.appendChild(block);
      }

      knowledge.classList.add("visible");
    }

    async function tracebreakSearch() {
      const endpoint =
        SUPABASE_SEARCH +
        "?q=" +
        encodeQuery(query) +
        "&limit=100";

      const response = await fetch(endpoint, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(
          "TraceBreak search failed"
        );
      }

      return response.json();
    }

    async function run() {
      if (!query) {
        meta.textContent = "";
        results.className = "empty";
        results.textContent =
          "Enter a search query.";
        return;
      }

      const searchPromise =
        tracebreakSearch();

      const wikiPromise =
        wikipedia();

      const ddgPromise =
        duckDuckGo();

      try {
        const data =
          await searchPromise;

        const list =
          Array.isArray(data.results)
            ? data.results
            : [];

        results.textContent = "";
        results.className = "";

        if (!list.length) {
          meta.textContent =
            "No indexed results";

          results.className = "empty";
          results.textContent =
            "TraceBreak hasn't indexed anything matching that query yet.";
        } else {
          meta.textContent =
            list.length +
            " indexed results";

          list
            .slice(0, 20)
            .forEach(renderResult);
        }
      } catch (error) {
        console.error(error);

        meta.textContent = "";
        results.className = "empty";
        results.textContent =
          "TraceBreak search is temporarily unavailable.";
      }

      const [wiki, ddg] =
        await Promise.all([
          wikiPromise,
          ddgPromise
        ]);

      showKnowledge(wiki, ddg);
    }

    run();
  </script>
</body>
</html>
