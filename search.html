<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceBreak Search</title>
  <meta name="description" content="Trace the web, not the user.">

  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 15px 24px;
      border-bottom: 1px solid #e8e8e8;
      background: #fffffff2;
      backdrop-filter: blur(9px);
    }

    .top {
      width: min(1080px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .search {
      width: min(720px, 100%);
      display: flex;
      gap: 8px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      outline: none;
      background: #fff;
      color: #171717;
      font-size: 15px;
    }

    .search input:focus {
      border-color: #777;
      box-shadow: 0 0 0 3px #0000000c;
    }

    .search button {
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: #171717;
      color: #fff;
      cursor: pointer;
    }

    .search button:hover {
      background: #303030;
    }

    .layout {
      width: min(1080px, calc(100% - 48px));
      margin: 30px auto 80px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 55px;
    }

    .meta {
      margin-bottom: 24px;
      color: #777;
      font-size: 13px;
    }

    .result {
      margin-bottom: 30px;
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .favicon {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      border-radius: 4px;
      object-fit: contain;
      flex: 0 0 20px;
    }

    .result-title {
      display: block;
      color: #174ea6;
      text-decoration: none;
      font-size: 19px;
      line-height: 1.25;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-url {
      margin: 5px 0 4px 30px;
      overflow: hidden;
      color: #28743b;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .description {
      max-width: 760px;
      margin: 0 0 0 30px;
      color: #4c4c4c;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      padding: 45px 0;
      color: #777;
      font-size: 14px;
    }

    .knowledge {
      display: none;
      border-left: 1px solid #e5e5e5;
      padding-left: 24px;
    }

    .knowledge.show {
      display: block;
    }

    .knowledge h2 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .knowledge-source {
      margin-bottom: 16px;
      color: #777;
      font-size: 12px;
    }

    .knowledge-image {
      width: 100%;
      max-height: 180px;
      margin-bottom: 15px;
      border-radius: 6px;
      object-fit: cover;
    }

    .knowledge-description {
      margin: 0;
      color: #444;
      font-size: 14px;
      line-height: 1.55;
    }

    .knowledge-link {
      display: inline-block;
      margin-top: 13px;
      color: #174ea6;
      font-size: 13px;
      text-decoration: none;
    }

    .knowledge-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .knowledge {
        border-top: 1px solid #e5e5e5;
        border-left: 0;
        padding: 25px 0 0;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 13px 16px;
      }

      .top {
        gap: 13px;
      }

      .brand {
        font-size: 18px;
      }

      .search button {
        display: none;
      }

      .layout {
        width: calc(100% - 32px);
        margin-top: 24px;
      }

      .result-url,
      .description {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <a class="brand" href="index.html">TraceBreak</a>

      <form class="search" id="search">
        <input id="query" name="q" type="search" autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="layout">
    <section>
      <div class="meta" id="meta">Searching...</div>
      <div id="results"></div>
    </section>

    <aside class="knowledge" id="knowledge">
      <div id="knowledge-content"></div>
    </aside>
  </main>

  <script>
    const SUPABASE_FUNCTION =
      "https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-search";

    const params = new URLSearchParams(location.search);
    const query = params.get("q") || "";

    const input = document.getElementById("query");
    const results = document.getElementById("results");
    const meta = document.getElementById("meta");
    const knowledge = document.getElementById("knowledge");
    const knowledgeContent = document.getElementById("knowledge-content");

    input.value = query;

    function encodeQuery(value) {
      return value.trim().split(/\s+/).join("+");
    }

    function searchUrl(value) {
      return "search.html?q=" + encodeQuery(value);
    }

    document.getElementById("search").addEventListener("submit", event => {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        return;
      }

      location.href = searchUrl(value);
    });

    function getFavicon(item) {
      if (item.favicon) {
        const image = document.createElement("img");

        image.className = "favicon";
        image.src = item.favicon;
        image.alt = "";
        image.loading = "lazy";

        return image;
      }

      return null;
    }

    function addResult(item) {
      const article = document.createElement("article");
      article.className = "result";

      const head = document.createElement("div");
      head.className = "result-head";

      const icon = getFavicon(item);

      if (icon) {
        head.appendChild(icon);
      }

      const title = document.createElement("a");

      title.className = "result-title";
      title.href = item.url;
      title.target = "_blank";
      title.rel = "noopener noreferrer";
      title.textContent = item.title || item.url;

      head.appendChild(title);

      const resultUrl = document.createElement("div");

      resultUrl.className = "result-url";
      resultUrl.textContent = item.url;

      const description = document.createElement("p");

      description.className = "description";
      description.textContent =
        item.description ||
        "No description available.";

      article.appendChild(head);
      article.appendChild(resultUrl);
      article.appendChild(description);

      results.appendChild(article);
    }

    function showKnowledge(data) {
      const panel = data.knowledge;

      if (!panel || !panel.title) {
        return;
      }

      knowledgeContent.textContent = "";

      const title = document.createElement("h2");
      title.textContent = panel.title;

      const source = document.createElement("div");
      source.className = "knowledge-source";
      source.textContent = panel.source || "Knowledge";

      knowledgeContent.appendChild(title);
      knowledgeContent.appendChild(source);

      if (panel.image_url) {
        const image = document.createElement("img");

        image.className = "knowledge-image";
        image.src = panel.image_url;
        image.alt = "";
        image.loading = "lazy";

        knowledgeContent.appendChild(image);
      }

      if (panel.description) {
        const description = document.createElement("p");

        description.className = "knowledge-description";
        description.textContent = panel.description;

        knowledgeContent.appendChild(description);
      }

      if (panel.source_url) {
        const link = document.createElement("a");

        link.className = "knowledge-link";
        link.href = panel.source_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Read more";

        knowledgeContent.appendChild(link);
      }

      knowledge.classList.add("show");
    }

    async function search() {
      if (!query.trim()) {
        meta.textContent = "";
        results.className = "empty";
        results.textContent = "Enter a search query.";
        return;
      }

      try {
        const request =
          SUPABASE_FUNCTION +
          "?q=" +
          encodeQuery(query) +
          "&limit=100";

        const response = await fetch(request, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Search request failed");
        }

        const data = await response.json();
        const list = Array.isArray(data.results)
          ? data.results
          : [];

        results.textContent = "";
        results.className = "";

        if (!list.length) {
          meta.textContent = "No results";
          results.className = "empty";
          results.textContent = "Nothing matched that query.";
          return;
        }

        meta.textContent =
          list.length +
          " results";

        list
          .slice(0, 20)
          .forEach(addResult);

        showKnowledge(data);
      } catch (error) {
        console.error(error);

        meta.textContent = "";
        results.className = "empty";
        results.textContent =
          "Search is temporarily unavailable.";
      }
    }

    search();
  </script>
</body>
</html>
