<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceBreak</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#181818;background:#fff}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e5e5}
.top{width:min(1160px,calc(100% - 32px));margin:auto;min-height:68px;display:flex;align-items:center;gap:24px}
.logo{font-weight:700;font-size:21px;letter-spacing:-1px;text-decoration:none;color:#111}
.search{display:flex;flex:1;max-width:760px}
.search input{width:100%;height:42px;border:1px solid #ccc;border-radius:7px 0 0 7px;padding:0 14px;font-size:15px;outline:none}
.search input:focus{border-color:#777}
.search button{height:42px;border:0;background:#171717;color:#fff;padding:0 20px;border-radius:0 7px 7px 0;cursor:pointer}
.layout{width:min(1160px,calc(100% - 32px));margin:25px auto 80px;display:grid;grid-template-columns:minmax(0,760px) 320px;gap:55px}
.stats{font-size:13px;color:#777;margin-bottom:24px}
.result{margin-bottom:27px}
.resultTop{display:flex;gap:9px}
.icon{width:19px;height:19px;object-fit:contain;margin-top:3px;border-radius:4px}
.resultTitle{font-size:19px;line-height:1.3;color:#174ea6;text-decoration:none}
.resultTitle:hover{text-decoration:underline}
.url{margin:5px 0 4px 28px;font-size:13px;color:#28743b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{margin:0 0 0 28px;font-size:14px;line-height:1.55;color:#4b4b4b}
.panel{display:none;border-left:1px solid #e5e5e5;padding-left:24px}
.panel.show{display:block}
.panelLabel{font-size:11px;color:#777;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:13px}
.panel h2{font-size:24px;margin:0 0 5px;line-height:1.2}
.panelSource{font-size:12px;color:#777;margin-bottom:14px}
.panel img{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:7px;margin-bottom:14px}
.panel p{font-size:14px;line-height:1.55;color:#444;margin:0}
.panel a{display:inline-block;margin-top:12px;font-size:13px;color:#174ea6;text-decoration:none}
.tool{border:1px solid #e4e4e4;border-radius:9px;padding:15px;margin-bottom:18px}
.toolTitle{font-size:13px;font-weight:700;margin-bottom:8px}
.toolValue{font-size:22px}
.toolSmall{font-size:13px;color:#666;margin-top:4px}
.weatherIcon{font-size:27px;margin-right:8px}
.imageGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 28px}
.imageGrid img{width:100%;height:110px;object-fit:cover;border-radius:6px}
@media(max-width:850px){
.layout{grid-template-columns:1fr}
.panel{border-left:0;border-top:1px solid #e5e5e5;padding:24px 0 0}
}
@media(max-width:600px){
.top{gap:12px}
.logo{font-size:18px}
.search button{display:none}
.search input{border-radius:7px}
.url,.desc{margin-left:0}
}
</style>
</head>

<body>

<header>
<div class="top">
<a class="logo" href="index.html">TraceBreak</a>

<form class="search" id="form">
<input id="q" type="search" autocomplete="off" spellcheck="false">
<button>Search</button>
</form>
</div>
</header>

<main class="layout">

<section>
<div class="stats" id="stats">Searching...</div>
<div id="tools"></div>
<div id="images"></div>
<div id="results"></div>
</section>

<aside class="panel" id="panel">
<div class="panelLabel">Knowledge</div>
<div id="panelBody"></div>
</aside>

</main>

<script>
const SUPA=
"https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/";

const params=
new URLSearchParams(location.search);

const query=
(params.get("q")||"").trim();

const q=
document.getElementById("q");

const stats=
document.getElementById("stats");

const results=
document.getElementById("results");

const tools=
document.getElementById("tools");

const images=
document.getElementById("images");

const panel=
document.getElementById("panel");

const panelBody=
document.getElementById("panelBody");

const started=
performance.now();

const seen=
new Set();

q.value=
query.replace(/\+/g," ");

function plusQuery(value){
return value
.trim()
.split(/\s+/)
.map(encodeURIComponent)
.join("+");
}

document
.getElementById("form")
.addEventListener("submit",e=>{
e.preventDefault();

const value=
q.value.trim();

if(value){
location.href=
"search.html?q="+plusQuery(value);
}
});

function elapsed(){
return Math.round(performance.now()-started);
}

function updateStats(){
const count=
document.querySelectorAll(".result").length;

stats.textContent=
(count||0)+
(count===1?" result":" results")+
" · "+
elapsed()+
" ms";
}

function key(url){
try{
const u=
new URL(url);

u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid"
].forEach(x=>u.searchParams.delete(x));

return u.toString();
}catch{
return url;
}
}

function makeIcon(url){
try{
const u=
new URL(url);

const img=
document.createElement("img");

img.className="icon";
img.loading="lazy";
img.alt="";
img.src=
u.origin+"/favicon.ico";

img.onerror=()=>{
img.remove();
};

return img;
}catch{
return null;
}
}

function addResult(item){
const url=
item?.url||
item?.link||
item?.href;

if(!url)return false;

const k=
key(url);

if(seen.has(k))return false;

seen.add(k);

const article=
document.createElement("article");

article.className="result";

const top=
document.createElement("div");

top.className="resultTop";

const icon=
item.favicon?
document.createElement("img"):
makeIcon(url);

if(icon){
icon.className="icon";
icon.loading="lazy";
icon.alt="";

if(item.favicon){
icon.src=item.favicon;
icon.onerror=()=>{
const fallback=makeIcon(url);
if(fallback)icon.replaceWith(fallback);
else icon.remove();
};
}

top.appendChild(icon);
}

const title=
document.createElement("a");

title.className="resultTitle";
title.href=url;
title.target="_blank";
title.rel="noopener noreferrer";
title.textContent=
item.title||
item.name||
url;

top.appendChild(title);

const urlNode=
document.createElement("div");

urlNode.className="url";
urlNode.textContent=url;

const desc=
document.createElement("p");

desc.className="desc";
desc.textContent=
item.description||
item.snippet||
"";

article.append(top,urlNode,desc);
results.appendChild(article);

updateStats();

return true;
}

function addResults(list){
if(!Array.isArray(list))return;

for(const item of list){
addResult(item);
}
}

function showPanel(data,source){
panelBody.replaceChildren();

const title=
document.createElement("h2");

title.textContent=
data.title||
query;

const src=
document.createElement("div");

src.className="panelSource";
src.textContent=source;

panelBody.append(title,src);

if(data.image){

const img=
document.createElement("img");

img.src=data.image;
img.alt="";
img.loading="eager";

img.onerror=()=>{
img.remove();
};

panelBody.appendChild(img);
}

if(data.description){

const p=
document.createElement("p");

p.textContent=data.description;
panelBody.appendChild(p);
}

if(data.url){

const a=
document.createElement("a");

a.href=data.url;
a.target="_blank";
a.rel="noopener noreferrer";
a.textContent="Read more";

panelBody.appendChild(a);
}

panel.classList.add("show");
}

async function wikipedia(){
try{

const response=
await fetch(
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(query),
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!response.ok)return;

const d=
await response.json();

if(!d.title&&!d.extract)return;

showPanel({
title:d.title,
description:d.extract,
image:d.thumbnail?.source||
d.originalimage?.source,
url:d.content_urls?.desktop?.page
},"Wikipedia");

}catch{}
}

async function ddg(){
try{

const response=
await fetch(
"https://api.duckduckgo.com/?q="+
encodeURIComponent(query)+
"&format=json&no_html=1&skip_disambig=1",
{
cache:"no-store"
}
);

if(!response.ok)return;

const d=
await response.json();

if(
d.AbstractText&&
!panel.classList.contains("show")
){

showPanel({
title:d.Heading||query,
description:d.AbstractText,
image:d.Image||"",
url:d.AbstractURL||""
},"DuckDuckGo");
}

}catch{}
}

function calculator(){

if(!/^[0-9+\-*/().%\s]+$/.test(query)){
return;
}

try{

const value=
Function(
"\"use strict\";return("+query+")"
)();

if(!Number.isFinite(value))return;

const box=
document.createElement("div");

box.className="tool";

const title=
document.createElement("div");

title.className="toolTitle";
title.textContent="Calculator";

const answer=
document.createElement("div");

answer.className="toolValue";
answer.textContent=String(value);

box.append(title,answer);
tools.appendChild(box);

}catch{}
}

function convert(){

const m=
query.match(
/^(-?[\d.,]+)\s*(km|mi|m|ft|kg|lb|c|f|°c|°f)$/i
);

if(!m)return;

const n=
Number(m[1].replace(/,/g,""));

const unit=
m[2].toLowerCase();

let value;
let out;

if(unit==="km"){
value=n*0.621371;
out=value.toFixed(4)+" mi";
}

if(unit==="mi"){
value=n*1.609344;
out=value.toFixed(4)+" km";
}

if(unit==="m"){
value=n*3.28084;
out=value.toFixed(4)+" ft";
}

if(unit==="ft"){
value=n*0.3048;
out=value.toFixed(4)+" m";
}

if(unit==="kg"){
value=n*2.2046226218;
out=value.toFixed(4)+" lb";
}

if(unit==="lb"){
value=n*0.45359237;
out=value.toFixed(4)+" kg";
}

if(unit==="c"||unit==="°c"){
value=n*9/5+32;
out=value.toFixed(2)+" °F";
}

if(unit==="f"||unit==="°f"){
value=(n-32)*5/9;
out=value.toFixed(2)+" °C";
}

if(!out)return;

const box=
document.createElement("div");

box.className="tool";

const title=
document.createElement("div");

title.className="toolTitle";
title.textContent="Conversion";

const answer=
document.createElement("div");

answer.className="toolValue";
answer.textContent=out;

box.append(title,answer);
tools.appendChild(box);
}

async function weather(){

if(!/\b(weather|temperature|forecast)\b/i.test(query)){
return;
}

try{

const city=
query
.replace(/\b(weather|temperature|forecast)\b/gi,"")
.trim();

if(!city)return;

const geo=
await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="+
encodeURIComponent(city)+
"&count=1&language=en&format=json"
);

const g=
await geo.json();

const place=
g.results?.[0];

if(!place)return;

const response=
await fetch(
"https://api.open-meteo.com/v1/forecast?latitude="+
place.latitude+
"&longitude="+
place.longitude+
"&current=temperature_2m,weather_code,wind_speed_10m"
);

const d=
await response.json();

const box=
document.createElement("div");

box.className="tool";

const title=
document.createElement("div");

title.className="toolTitle";
title.textContent=
"Weather · "+
place.name;

const value=
document.createElement("div");

value.className="toolValue";

value.textContent=
d.current.temperature_2m+
"°C";

const small=
document.createElement("div");

small.className="toolSmall";

small.textContent=
"Wind "+
d.current.wind_speed_10m+
" km/h";

box.append(title,value,small);
tools.appendChild(box);

}catch{}
}

async function searchLocal(){

try{

const response=
await fetch(
SUPA+
"tracebreak-search-fast?q="+
plusQuery(query)+
"&limit=100",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!response.ok)return;

const d=
await response.json();

addResults(d.results||[]);

}catch(error){
console.debug(error);
}
}

async function search360(){

try{

const response=
await fetch(
"https://api.360-search.com/?q="+
plusQuery(query)+
"&type=web&limit=30",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!response.ok)return;

const d=
await response.json();

addResults(d.results||[]);

}catch(error){
console.debug("360:",error);
}
}

async function searchYou(){

try{

const response=
await fetch(
SUPA+
"tracebreak-meta-fast?provider=you&q="+
plusQuery(query)+
"&limit=30",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!response.ok)return;

const d=
await response.json();

addResults(
d.providers?.you?.results||
d.you?.results||
[]
);

}catch(error){
console.debug("You:",error);
}
}

async function imagesSearch(){

try{

const response=
await fetch(
"https://api.360-search.com/?q="+
plusQuery(query)+
"&type=image&limit=12",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!response.ok)return;

const d=
await response.json();

const list=
Array.isArray(d.results)?
d.results:[];

if(!list.length)return;

const grid=
document.createElement("div");

grid.className="imageGrid";

for(const item of list){

const src=
item.image||
item.thumbnail;

if(!src)continue;

const img=
document.createElement("img");

img.src=src;
img.alt=item.title||"";
img.loading="lazy";

grid.appendChild(img);
}

if(grid.children.length){
images.appendChild(grid);
}

}catch{}
}

function run(){

if(!query){

stats.textContent=
"Enter a search query.";

return;
}

/*
 * Everything starts independently.
 * Nothing waits for another provider.
 */

searchLocal();
wikipedia();
ddg();
calculator();
convert();
weather();
search360();
imagesSearch();
searchYou();

}

run();
</script>

</body>
</html>
