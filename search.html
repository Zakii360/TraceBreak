<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceBreak</title>
<link rel="icon" href="/TraceBreak/favicon.svg">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0
}

body{
background:#fff;
color:#202124;
font-family:Arial,Helvetica,sans-serif
}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(255,255,255,.96);
border-bottom:1px solid #e5e5e5
}

.bar{
width:min(1120px,calc(100% - 32px));
min-height:66px;
margin:auto;
display:flex;
align-items:center;
gap:20px
}

.logo{
font-size:20px;
font-weight:700;
letter-spacing:-.7px;
color:#111;
text-decoration:none;
white-space:nowrap
}

.searchWrap{
position:relative;
width:min(700px,100%);
flex:1
}

.search{
display:flex
}

.search input{
width:100%;
height:40px;
padding:0 13px;
border:1px solid #c8c8c8;
border-right:0;
border-radius:6px 0 0 6px;
outline:none;
font-size:15px
}

.search input:focus{
border-color:#777
}

.search button{
height:40px;
padding:0 18px;
border:0;
border-radius:0 6px 6px 0;
background:#202124;
color:#fff;
cursor:pointer
}

.suggestions{
position:absolute;
top:44px;
left:0;
right:0;
display:none;
background:#fff;
border:1px solid #ddd;
border-radius:7px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.09);
z-index:100
}

.suggestions.active{
display:block
}

.suggestion{
display:block;
width:100%;
padding:10px 13px;
border:0;
background:#fff;
color:#202124;
font:14px Arial,sans-serif;
text-align:left;
cursor:pointer
}

.suggestion:hover,
.suggestion.selected{
background:#f3f3f3
}

.controls{
display:flex;
gap:7px
}

.control{
height:34px;
padding:0 11px;
border:1px solid #ccc;
border-radius:5px;
background:#fff;
color:#333;
cursor:pointer
}

.queryCorrection{
display:none;
margin:-7px 0 21px;
font-size:13px;
color:#555
}

.queryCorrection.active{
display:block
}

.queryCorrection a{
color:#1a0dab;
text-decoration:none
}

.queryCorrection a:hover{
text-decoration:underline
}

.layout{
width:min(1120px,calc(100% - 32px));
margin:25px auto 80px;
display:grid;
grid-template-columns:minmax(0,750px) 310px;
gap:50px
}

.status{
margin-bottom:12px;
color:#777;
font-size:13px
}

.result{
margin-bottom:27px;
animation:resultIn .12s ease-out
}

@keyframes resultIn{
from{
opacity:0;
transform:translateY(3px)
}
to{
opacity:1;
transform:none
}
}

.resultHead{
display:flex;
align-items:flex-start;
gap:8px
}

.favicon{
width:18px;
height:18px;
margin-top:4px;
object-fit:contain;
flex:0 0 18px
}

.resultTitle{
font-size:18px;
line-height:1.3;
color:#1a0dab;
text-decoration:none
}

.resultTitle:hover{
text-decoration:underline
}

.resultUrl{
margin:4px 0 4px 26px;
font-size:13px;
color:#188038;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.resultDesc{
margin:0 0 0 26px;
font-size:14px;
line-height:1.52;
color:#4d5156
}

.knowledge{
display:none;
align-self:start;
border-left:1px solid #e3e3e3;
padding-left:23px
}

.knowledge.active{
display:block
}

.kLabel{
margin-bottom:11px;
font-size:11px;
font-weight:700;
letter-spacing:.1em;
color:#777;
text-transform:uppercase
}

.knowledge h2{
margin:0 0 5px;
font-size:23px
}

.kSource{
margin-bottom:13px;
font-size:12px;
color:#777
}

.kImage{
width:100%;
max-height:190px;
object-fit:cover;
border-radius:6px;
margin-bottom:13px
}

.kText{
margin:0 0 12px;
font-size:14px;
line-height:1.55;
color:#444
}

.kLink{
font-size:13px;
color:#1a0dab;
text-decoration:none
}

.tool{
margin-bottom:17px;
padding:14px;
border:1px solid #e2e2e2;
border-radius:7px
}

.toolName{
margin-bottom:7px;
font-size:12px;
font-weight:700
}

.toolValue{
font-size:22px
}

.toolInfo{
margin-top:4px;
font-size:13px;
color:#666
}

.imageGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-bottom:28px
}

.imageGrid img{
width:100%;
height:105px;
border-radius:5px;
object-fit:cover
}

/* RubMode */

body.rubmode{
background:#fff;
color:#000;
font-family:"Times New Roman",serif
}

body.rubmode header{
position:static;
background:#fff;
border:0
}

body.rubmode .bar{
width:auto;
min-height:40px;
margin:0;
padding:6px;
gap:10px
}

body.rubmode .logo{
font-family:"Times New Roman",serif;
font-size:16px;
font-weight:normal;
letter-spacing:0
}

body.rubmode .searchWrap{
width:auto;
max-width:none;
flex:none
}

body.rubmode .search{
display:flex;
gap:4px
}

body.rubmode .search input{
width:300px;
height:20px;
padding:1px 2px;
border:1px solid #767676;
border-radius:0;
font:13.3333px Arial,sans-serif;
outline:none
}

body.rubmode .search button{
height:23px;
padding:1px 6px;
border:1px solid #767676;
border-radius:0;
background:#efefef;
color:#000;
font:13.3333px Arial,sans-serif
}

body.rubmode .control{
height:23px;
padding:1px 6px;
border:1px solid #767676;
border-radius:0;
background:#efefef;
color:#000;
font:13.3333px Arial,sans-serif
}

body.rubmode .suggestions{
top:24px;
border:1px solid #777;
border-radius:0;
box-shadow:none
}

body.rubmode .suggestion{
padding:3px 5px;
font:13.3333px Arial,sans-serif
}

body.rubmode main{
width:auto;
margin:10px 6px 50px;
display:block
}

body.rubmode .status{
color:#333
}

body.rubmode .queryCorrection{
margin-bottom:14px;
color:#000
}

body.rubmode .result{
margin-bottom:19px
}

body.rubmode .resultTitle{
font-family:Arial,Helvetica,sans-serif;
font-size:16px;
color:#00e;
text-decoration:underline
}

body.rubmode .resultUrl{
margin-left:24px;
color:#008000
}

body.rubmode .resultDesc{
margin-left:24px;
color:#000
}

body.rubmode .knowledge{
border-left:1px solid #777;
padding-left:12px
}

body.rubmode .tool{
border:1px solid #777;
border-radius:0;
padding:7px
}

body.rubmode .imageGrid img{
border-radius:0
}

@media(max-width:850px){

.layout{
grid-template-columns:1fr
}

.knowledge{
border-left:0;
border-top:1px solid #ddd;
padding:20px 0 0
}

}

@media(max-width:650px){

.bar{
flex-wrap:wrap;
padding:8px 0
}

.searchWrap{
order:3;
flex-basis:100%
}

.search input{
border-right:1px solid #ccc;
border-radius:6px
}

.search button{
display:none
}

.imageGrid{
grid-template-columns:repeat(2,1fr)
}

body.rubmode .searchWrap{
order:initial;
flex:none
}

body.rubmode .search input{
width:220px
}

}
</style>
</head>

<body>

<header>

<div class="bar">

<a class="logo" href="/TraceBreak/">TraceBreak</a>

<div class="searchWrap">

<form class="search" id="searchForm">
<input
id="queryInput"
type="search"
autocomplete="off"
spellcheck="false"
aria-label="Search"
>
<button type="submit">Search</button>
</form>

<div class="suggestions" id="suggestions"></div>

</div>

<div class="controls">
<button class="control" id="rubToggle" type="button">RubMode</button>
</div>

</div>

</header>

<main class="layout">

<section>

<div class="status" id="status">Searching...</div>

<div class="queryCorrection" id="correction"></div>

<div id="tools"></div>
<div id="images"></div>
<div id="results"></div>

</section>

<aside class="knowledge" id="knowledge">

<div class="kLabel">Knowledge</div>

<div id="knowledgeBody"></div>

</aside>

</main>

<script>
const BASE="/TraceBreak/";
const SUPABASE="https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/";

const params=new URLSearchParams(location.search);
const query=(params.get("q")||"").trim();

const input=document.getElementById("queryInput");
const status=document.getElementById("status");
const correction=document.getElementById("correction");
const suggestions=document.getElementById("suggestions");
const results=document.getElementById("results");
const tools=document.getElementById("tools");
const images=document.getElementById("images");
const knowledge=document.getElementById("knowledge");
const knowledgeBody=document.getElementById("knowledgeBody");
const rubToggle=document.getElementById("rubToggle");
const searchForm=document.getElementById("searchForm");

const seen=new Set();
const started=performance.now();

let suggestionIndex=-1;
let correctedQuery="";

input.value=query;

function encodeQuery(value){

const text=value.trim();

if(text.includes("+")){
return encodeURIComponent(text).replace(/%20/g,"+");
}

return text
.split(/\s+/)
.map(encodeURIComponent)
.join("+");
}

function goSearch(value){

value=value.trim();

if(!value)return;

location.href=
BASE+
"search.html?q="+
encodeQuery(value);
}

searchForm.addEventListener("submit",e=>{

e.preventDefault();

goSearch(input.value);
});

function querySuggestions(value){

const q=value.trim();

if(!q)return [];

const words=q.split(/\s+/).filter(Boolean);

const out=[
q,
q+" news",
q+" wikipedia",
q+" definition"
];

if(words.length===1){

const word=words[0];

out.push(
word+" meaning",
word+" history",
word+" latest"
);

if(
/^(math|algebra|geometry|calculus|physics)$/i.test(word)
){
out.push(
word+" calculator",
word+" equations",
word+" formulas"
);
}

if(
/^(trump|biden|president)$/i.test(word)
){
out.push(
word+" news",
word+" latest",
word+" biography"
);
}

}

if(
/^(weather|temperature|forecast)$/i.test(q)
){
out.push(
"weather today",
"weather tomorrow",
"weather near me"
);
}

if(
/^is\s+school\b/i.test(q)
){
out.push(
q+" today",
q+" tomorrow",
"school calendar"
);
}

return [...new Set(out)].slice(0,7);
}

function renderSuggestions(){

const list=
querySuggestions(input.value);

suggestions.replaceChildren();
suggestionIndex=-1;

if(!list.length){

suggestions.classList.remove("active");
return;
}

for(const value of list){

const button=document.createElement("button");

button.type="button";
button.className="suggestion";
button.textContent=value;

button.addEventListener("mousedown",e=>{
e.preventDefault();
goSearch(value);
});

suggestions.appendChild(button);
}

suggestions.classList.add("active");
}

input.addEventListener("input",()=>{

renderSuggestions();
});

input.addEventListener("keydown",e=>{

const items=
[...suggestions.querySelectorAll(".suggestion")];

if(!items.length)return;

if(e.key==="ArrowDown"){

e.preventDefault();

suggestionIndex=
(suggestionIndex+1)%items.length;

items.forEach(x=>
x.classList.remove("selected")
);

items[suggestionIndex].classList.add("selected");

input.value=
items[suggestionIndex].textContent;

}

if(e.key==="ArrowUp"){

e.preventDefault();

suggestionIndex=
suggestionIndex<=0?
items.length-1:
suggestionIndex-1;

items.forEach(x=>
x.classList.remove("selected")
);

items[suggestionIndex].classList.add("selected");

input.value=
items[suggestionIndex].textContent;

}

if(e.key==="Escape"){

suggestions.classList.remove("active");

}

});

document.addEventListener("click",e=>{

if(!e.target.closest(".searchWrap")){
suggestions.classList.remove("active");
}

});

rubToggle.addEventListener("click",()=>{

const enabled=
document.body.classList.toggle("rubmode");

rubToggle.textContent=
enabled?
"NormalMode":
"RubMode";

localStorage.setItem(
"tracebreak-rubmode",
enabled?"1":"0"
);

});

if(
localStorage.getItem("tracebreak-rubmode")==="1"
){

document.body.classList.add("rubmode");
rubToggle.textContent="NormalMode";

}

function elapsed(){

return Math.round(
performance.now()-started
);
}

function updateStatus(){

const count=
document.querySelectorAll(".result").length;

status.textContent=
(count||0)+
(count===1?" result":" results")+
" · "+
elapsed()+
" ms";
}

function canonical(url){

try{

const u=new URL(url);

u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid",
"dclid"
].forEach(k=>
u.searchParams.delete(k)
);

return u.toString();

}catch{

return String(url);
}
}

function favicon(url){

try{

const u=new URL(url);

const img=document.createElement("img");

img.className="favicon";
img.alt="";
img.loading="lazy";
img.src=u.origin+"/favicon.ico";

img.onerror=()=>{

if(img.dataset.fallback)return;

img.dataset.fallback="1";

img.src=
"https://www.google.com/s2/favicons?sz=32&domain_url="+
encodeURIComponent(url);

};

return img;

}catch{

return null;
}
}

function addResult(item){

if(!item)return false;

const url=
item.url||
item.link||
item.href;

if(!url)return false;

const key=canonical(url);

if(seen.has(key))return false;

seen.add(key);

const result=document.createElement("article");
result.className="result";

const head=document.createElement("div");
head.className="resultHead";

const icon=
item.favicon?
Object.assign(
document.createElement("img"),
{
className:"favicon",
alt:"",
loading:"lazy",
src:item.favicon
}
):
favicon(url);

if(icon){

icon.onerror=()=>{

if(icon.dataset.fallback)return;

icon.dataset.fallback="1";

icon.src=
"https://www.google.com/s2/favicons?sz=32&domain_url="+
encodeURIComponent(url);

};

head.appendChild(icon);

}

const title=document.createElement("a");

title.className="resultTitle";
title.href=url;
title.target="_blank";
title.rel="noopener noreferrer";

title.textContent=
item.title||
item.name||
url;

head.appendChild(title);

const urlNode=document.createElement("div");

urlNode.className="resultUrl";
urlNode.textContent=url;

const desc=document.createElement("p");

desc.className="resultDesc";

let text=
item.description||
item.snippet||
item.snippet_text||
"";

text=String(text)
.replace(/\s+/g," ")
.replace(
/^(summary|highlights|notes|overview|description)\s*:\s*/i,
""
)
.trim();

if(text.length>340){
text=
text.slice(0,337).trimEnd()+
"...";
}

desc.textContent=text;

result.append(
head,
urlNode,
desc
);

results.appendChild(result);

updateStatus();

return true;
}

function addResults(list){

if(!Array.isArray(list))return;

for(const item of list){
addResult(item);
}
}

function showCorrection(value){

if(!value||value.toLowerCase()===query.toLowerCase())
return;

correctedQuery=value;

correction.replaceChildren();

const text=document.createTextNode(
"Showing results for "
);

const link=document.createElement("a");

link.href=
BASE+
"search.html?q="+
encodeQuery(value);

link.textContent=value;

correction.append(text,link);
correction.classList.add("active");
}

function handleCorrection(data){

const value=
data?.corrected_query||
data?.suggestion||
data?.spellcheck||
data?.did_you_mean;

if(typeof value==="string"){
showCorrection(value);
}

}

function showKnowledge(data,source){

if(
!data||
(!data.title&&!data.description)
)return;

knowledgeBody.replaceChildren();

const title=document.createElement("h2");
title.textContent=data.title||query;

const sourceNode=document.createElement("div");
sourceNode.className="kSource";
sourceNode.textContent=source;

knowledgeBody.append(
title,
sourceNode
);

if(data.image){

const img=document.createElement("img");

img.className="kImage";
img.src=data.image;
img.alt="";
img.loading="eager";

img.onerror=()=>img.remove();

knowledgeBody.appendChild(img);
}

if(data.description){

const text=document.createElement("p");

text.className="kText";
text.textContent=data.description;

knowledgeBody.appendChild(text);
}

if(data.url){

const link=document.createElement("a");

link.className="kLink";
link.href=data.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Read more";

knowledgeBody.appendChild(link);
}

knowledge.classList.add("active");
}

async function wikipedia(){

try{

const r=await fetch(
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&list=search"+
"&srsearch="+
encodeURIComponent(query)+
"&srnamespace=0"+
"&srlimit=1"+
"&format=json"+
"&origin=*",
{cache:"no-store"}
);

if(!r.ok)return;

const d=await r.json();
const match=d.query?.search?.[0];

if(!match)return;

const page=await fetch(
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(match.title),
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!page.ok)return;

const data=await page.json();

showKnowledge({
title:data.title,
description:data.extract,
image:
data.thumbnail?.source||
data.originalimage?.source,
url:data.content_urls?.desktop?.page
},"Wikipedia");

}catch(e){

console.debug("Wikipedia",e);
}
}

async function duckduckgo(){

try{

const r=await fetch(
"https://api.duckduckgo.com/?q="+
encodeURIComponent(query)+
"&format=json"+
"&no_html=1"+
"&skip_disambig=1",
{cache:"no-store"}
);

if(!r.ok)return;

const d=await r.json();

if(
d.AbstractText&&
!knowledge.classList.contains("active")
){

showKnowledge({
title:d.Heading||query,
description:d.AbstractText,
image:d.Image,
url:d.AbstractURL
},"DuckDuckGo");

}

}catch(e){

console.debug("DDG",e);
}
}

function calculator(){

if(
!/^[0-9+\-*/().%\s]+$/.test(query)
)return;

try{

const value=
Function(
"\"use strict\";return("+query+")"
)();

if(!Number.isFinite(value))return;

const box=document.createElement("div");
box.className="tool";

const name=document.createElement("div");
name.className="toolName";
name.textContent="Calculator";

const answer=document.createElement("div");
answer.className="toolValue";
answer.textContent=String(value);

box.append(name,answer);
tools.appendChild(box);

}catch{}
}

function conversion(){

const m=query.match(
/^(-?[\d.,]+)\s*(km|mi|m|ft|kg|lb|g|oz|c|f|°c|°f)$/i
);

if(!m)return;

const n=Number(
m[1].replace(/,/g,"")
);

const u=m[2].toLowerCase();

let out="";

if(u==="km")out=(n*.621371).toFixed(4)+" mi";
else if(u==="mi")out=(n*1.609344).toFixed(4)+" km";
else if(u==="m")out=(n*3.28084).toFixed(4)+" ft";
else if(u==="ft")out=(n*.3048).toFixed(4)+" m";
else if(u==="kg")out=(n*2.2046226218).toFixed(4)+" lb";
else if(u==="lb")out=(n*.45359237).toFixed(4)+" kg";
else if(u==="g")out=(n*.035273962).toFixed(4)+" oz";
else if(u==="oz")out=(n*28.349523125).toFixed(4)+" g";
else if(u==="c"||u==="°c")out=(n*9/5+32).toFixed(2)+" °F";
else if(u==="f"||u==="°f")out=((n-32)*5/9).toFixed(2)+" °C";

if(!out)return;

const box=document.createElement("div");
box.className="tool";

const name=document.createElement("div");
name.className="toolName";
name.textContent="Conversion";

const value=document.createElement("div");
value.className="toolValue";
value.textContent=out;

box.append(name,value);
tools.appendChild(box);
}

async function weather(){

const m=query.match(
/^(?:weather|temperature|forecast)\s+(?:in|for|at)\s+(.+)$/i
);

if(!m)return;

try{

const geo=await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="+
encodeURIComponent(m[1])+
"&count=1&language=en&format=json",
{cache:"no-store"}
);

if(!geo.ok)return;

const g=await geo.json();
const place=g.results?.[0];

if(!place)return;

const r=await fetch(
"https://api.open-meteo.com/v1/forecast?latitude="+
place.latitude+
"&longitude="+
place.longitude+
"&current=temperature_2m,wind_speed_10m",
{cache:"no-store"}
);

if(!r.ok)return;

const d=await r.json();

const box=document.createElement("div");
box.className="tool";

const name=document.createElement("div");
name.className="toolName";
name.textContent="Weather · "+place.name;

const value=document.createElement("div");
value.className="toolValue";
value.textContent=
Math.round(d.current.temperature_2m)+
"°C";

const info=document.createElement("div");
info.className="toolInfo";
info.textContent=
"Wind "+
Math.round(d.current.wind_speed_10m)+
" km/h";

box.append(name,value,info);
tools.appendChild(box);

}catch(e){

console.debug("Weather",e);
}
}

async function tracebreak(){

try{

const r=await fetch(
SUPABASE+
"tracebreak-search-fast?q="+
encodeQuery(query)+
"&limit=100",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

handleCorrection(d);

addResults(d.results||[]);

}catch(e){

console.debug("TraceBreak",e);

async function imageSearch(){

try{

const r=await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=image"+
"&safe=moderate"+
"&limit=12",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

const list=
Array.isArray(d.results)?
d.results:
[];

if(!list.length)return;

const grid=document.createElement("div");
grid.className="imageGrid";

for(const item of list){

const src=
item.image||
item.thumbnail;

if(!src)continue;

const img=document.createElement("img");

img.src=src;
img.alt=item.title||"";
img.loading="lazy";

img.onerror=()=>img.remove();

grid.appendChild(img);
}

if(grid.children.length){
images.appendChild(grid);
}

}catch(e){

console.debug("Images",e);
}
}

you();

}

run();
