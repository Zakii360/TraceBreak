<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceBreak</title>
<meta name="description" content="Trace the web, not the user.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
*{box-sizing:border-box}

:root{
font-family:Arial,Helvetica,sans-serif;
color:#171717;
background:#fff
}

body{
margin:0;
background:#fff
}

header{
position:sticky;
top:0;
z-index:20;
padding:14px 24px;
border-bottom:1px solid #e7e7e7;
background:rgba(255,255,255,.96);
backdrop-filter:blur(14px)
}

.top{
width:min(1120px,100%);
margin:auto;
display:flex;
align-items:center;
gap:24px
}

.brand{
color:#171717;
font-size:20px;
font-weight:700;
letter-spacing:-1px;
text-decoration:none;
white-space:nowrap
}

.search{
display:flex;
width:min(760px,100%);
gap:8px
}

.search input{
width:100%;
height:42px;
padding:0 14px;
border:1px solid #cfcfcf;
border-radius:7px;
outline:0;
font-size:15px
}

.search input:focus{
border-color:#777;
box-shadow:0 0 0 3px rgba(0,0,0,.05)
}

.search button{
height:42px;
padding:0 18px;
border:0;
border-radius:7px;
background:#171717;
color:#fff;
cursor:pointer
}

.layout{
width:min(1120px,calc(100% - 48px));
margin:28px auto 90px;
display:grid;
grid-template-columns:minmax(0,1fr) 310px;
gap:48px
}

.meta{
margin-bottom:22px;
color:#777;
font-size:13px
}

.result{
margin-bottom:28px;
animation:show .12s ease-out
}

@keyframes show{
from{
opacity:0;
transform:translateY(3px)
}
to{
opacity:1;
transform:translateY(0)
}
}

.result-head{
display:flex;
align-items:flex-start;
gap:9px
}

.favicon{
width:20px;
height:20px;
margin-top:2px;
object-fit:contain;
border-radius:4px;
flex:0 0 20px
}

.result-title{
color:#174ea6;
font-size:19px;
line-height:1.3;
text-decoration:none
}

.result-title:hover{
text-decoration:underline
}

.result-url{
margin:5px 0 4px 29px;
overflow:hidden;
color:#28743b;
font-size:13px;
text-overflow:ellipsis;
white-space:nowrap
}

.description{
max-width:760px;
margin:0 0 0 29px;
color:#4b4b4b;
font-size:14px;
line-height:1.55
}

.knowledge{
display:none;
align-self:start;
border-left:1px solid #e5e5e5;
padding-left:24px
}

.knowledge.visible{
display:block
}

.knowledge-label{
margin-bottom:14px;
color:#777;
font-size:11px;
font-weight:600;
letter-spacing:.1em;
text-transform:uppercase
}

.knowledge-title{
margin:0;
font-size:24px;
line-height:1.2
}

.knowledge-source{
margin:6px 0 15px;
color:#777;
font-size:12px
}

.knowledge-image{
display:block;
width:100%;
max-height:190px;
margin-bottom:15px;
border-radius:7px;
object-fit:cover
}

.knowledge-description{
margin:0;
color:#444;
font-size:14px;
line-height:1.55
}

.knowledge-link{
display:inline-block;
margin-top:13px;
color:#174ea6;
font-size:13px;
text-decoration:none
}

.empty{
padding:35px 0;
color:#777;
font-size:14px
}

@media(max-width:850px){
.layout{
grid-template-columns:1fr
}

.knowledge{
border-top:1px solid #e5e5e5;
border-left:0;
padding:25px 0 0
}
}

@media(max-width:600px){
header{
padding:13px 16px
}

.top{
gap:14px
}

.search button{
display:none
}

.layout{
width:calc(100% - 32px);
margin-top:22px
}

.result-url,
.description{
margin-left:0
}
}
</style>
</head>

<body>

<header>
<div class="top">

<a class="brand" href="index.html">TraceBreak</a>

<form class="search" id="search-form">
<input
id="query"
type="search"
autocomplete="off"
spellcheck="false"
>
<button type="submit">Search</button>
</form>

</div>
</header>

<main class="layout">

<section>

<div class="meta" id="meta">
Searching...
</div>

<div id="results"></div>

</section>

<aside id="knowledge" class="knowledge">

<div class="knowledge-label">
Knowledge
</div>

<div id="knowledge-content"></div>

</aside>

</main>

<script>
const SUPABASE=
"https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-search-fast";

const params=
new URLSearchParams(location.search);

const query=
(params.get("q")||"").trim();

const input=
document.getElementById("query");

const results=
document.getElementById("results");

const meta=
document.getElementById("meta");

const knowledge=
document.getElementById("knowledge");

const knowledgeContent=
document.getElementById("knowledge-content");

const seen=
new Set();

const started=
performance.now();

input.value=
query.replace(/\+/g," ");

function encodeQuery(value){
let output="";

for(const char of value.trim()){
if(char==="+"){
output+="+";
}else{
output+=encodeURIComponent(char);
}
}

return output;
}

document
.getElementById("search-form")
.addEventListener("submit",event=>{
event.preventDefault();

const value=
input.value.trim();

if(!value)return;

location.href=
"search.html?q="+
encodeQuery(value);
});

function canonical(value){
try{
const u=
new URL(value);

u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid",
"dclid"
].forEach(key=>{
u.searchParams.delete(key);
});

return u.toString();
}catch{
return value;
}
}

function favicon(url){
try{
const u=
new URL(url);

const image=
document.createElement("img");

image.className="favicon";
image.alt="";
image.loading="lazy";
image.src=
u.origin+
"/favicon.ico";

image.onerror=()=>{
image.remove();
};

return image;
}catch{
return null;
}
}

function addResult(item){
if(!item)return false;

const url=
item.url||
item.link;

if(!url)return false;

const key=
canonical(url);

if(seen.has(key))return false;

seen.add(key);

const article=
document.createElement("article");

article.className="result";

const head=
document.createElement("div");

head.className="result-head";

if(item.favicon){
const icon=
document.createElement("img");

icon.className="favicon";
icon.alt="";
icon.loading="lazy";
icon.src=item.favicon;

icon.onerror=()=>{
const fallback=
favicon(url);

if(fallback){
icon.replaceWith(fallback);
}else{
icon.remove();
}
};

head.appendChild(icon);
}else{
const icon=
favicon(url);

if(icon){
head.appendChild(icon);
}
}

const title=
document.createElement("a");

title.className="result-title";
title.href=url;
title.target="_blank";
title.rel="noopener noreferrer";
title.textContent=
item.title||
item.name||
url;

head.appendChild(title);

const urlLine=
document.createElement("div");

urlLine.className="result-url";
urlLine.textContent=url;

const description=
document.createElement("p");

description.className="description";
description.textContent=
item.description||
item.snippet||
"";

article.appendChild(head);
article.appendChild(urlLine);
article.appendChild(description);

results.appendChild(article);

return true;
}

function addResults(items){
if(!Array.isArray(items))return 0;

let count=0;

for(const item of items){
if(addResult(item)){
count++;
}
}

return count;
}

function updateCount(){
const count=
document.querySelectorAll(".result").length;

if(count){
meta.textContent=
count+
(count===1?" result":" results")+
" · "+
Math.round(performance.now()-started)+
" ms";
}else{
meta.textContent=
"No indexed results · "+
Math.round(performance.now()-started)+
" ms";
}
}

async function localSearch(){
try{

const response=
await fetch(
SUPABASE+
"?q="+
encodeQuery(query)+
"&limit=100",
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok){
throw Error("search failed");
}

const data=
await response.json();

const count=
addResults(data.results||[]);

const elapsed=
Number.isFinite(data.elapsed_ms)?
data.elapsed_ms:
Math.round(performance.now()-started);

meta.textContent=
(count||0)+
(count===1?" result":" results")+
" · "+
elapsed+
" ms";

}catch(error){

console.error(error);

meta.textContent=
"Search unavailable · "+
Math.round(performance.now()-started)+
" ms";
}
}

async function wikipedia(){
if(!query)return;

try{

const title=
query
.replace(/\s+/g," ")
.trim();

const response=
await fetch(
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(title),
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

if(
data.type==="https://mediawiki.org/wiki/HyperSwitch/errors/not_found"
){
return;
}

if(!data.title&&!data.extract){
return;
}

showKnowledge({
title:data.title,
description:data.extract,
image:data.thumbnail?.source||
data.originalimage?.source||
"",
url:data.content_urls?.desktop?.page||
data.content_urls?.mobile?.page||
""
});

}catch(error){
console.debug("Wikipedia:",error);
}
}

function showKnowledge(item){
knowledgeContent.replaceChildren();

const title=
document.createElement("h2");

title.className="knowledge-title";
title.textContent=
item.title||
query;

knowledgeContent.appendChild(title);

const source=
document.createElement("div");

source.className="knowledge-source";
source.textContent=
"Wikipedia";

knowledgeContent.appendChild(source);

if(item.image){

const image=
document.createElement("img");

image.className="knowledge-image";
image.loading="eager";
image.src=item.image;
image.alt="";

image.onerror=()=>{
image.remove();
};

knowledgeContent.appendChild(image);
}

if(item.description){

const description=
document.createElement("p");

description.className=
"knowledge-description";

description.textContent=
item.description;

knowledgeContent.appendChild(description);
}

if(item.url){

const link=
document.createElement("a");

link.className="knowledge-link";
link.href=item.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Wikipedia";

knowledgeContent.appendChild(link);
}

knowledge.classList.add("visible");
}

async function youSearch(){
try{

const endpoint=
"https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-meta?q="+
encodeQuery(query)+
"&provider=you&limit=20";

const response=
await fetch(
endpoint,
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

const items=
data.you?.results||
data.providers?.you?.results||
data.results||
[];

addResults(items);

updateCount();

}catch(error){
console.debug("You:",error);
}
}

async function search360(){
try{

const endpoint=
"https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/tracebreak-meta?q="+
encodeQuery(query)+
"&provider=360&limit=20";

const response=
await fetch(
endpoint,
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=
await response.json();

const items=
data["360"]?.results||
data.providers?.["360"]?.results||
data.results||
[];

addResults(items);

updateCount();

}catch(error){
console.debug("360:",error);
}
}

async function run(){

if(!query){

meta.textContent="Enter a search query.";

results.className="empty";
results.textContent=
"Search the web with TraceBreak.";

return;
}

results.innerHTML="";
meta.textContent=
"Searching · "+
Math.round(performance.now()-started)+
" ms";

/*
 * Everything starts together.
 * None of the secondary requests
 * block the local index.
 */

localSearch();

wikipedia();

youSearch();

search360();

}

run();
</script>

</body>
</html>
