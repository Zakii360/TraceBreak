<html lang="en">
<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:#fff;
color:#202124;

}
header{
position:sticky;
top:0;

.bar{
width:min(1120px,calc(100% - 32px));

.logo{

.searchWrap{

flex:1
}
.search{

}
.search input{
width:100%;
height:40px;
padding:0 13px;

.controls{

.suggestions{

.suggestions.active{display:block}
.suggestion{
display:flex;
align-items:center;
width:100%;
gap:9px;

border:0;

.suggestion:hover,.suggestion.selected{background:#f3f3f3}
.suggestionIcon{width:16px;color:#777}

.layout{
width:min(1120px,calc(100% - 32px));
margin:25px auto 80px;
display:grid;
grid-template-columns:minmax(0,750px) 310px;
gap:50px
}
.status{
margin-bottom:12px;
color:#777;
font-size:13px
}
.correction{
display:none;
margin:-4px 0 20px;
font-size:13px;
color:#555
}
.correction.active{display:block}
.correction a{
color:#1a0dab;
text-decoration:none
}
.result{
margin-bottom:27px;
animation:resultIn .12s ease-out
}

from{opacity:0;transform:translateY(3px)}
to{opacity:1;transform:none}
}
.resultHead{
display:flex;
align-items:flex-start;
gap:8px
}
.favicon{
width:18px;
height:18px;
margin-top:4px;
object-fit:contain;
flex:none
}
.resultTitle{
font-size:18px;
line-height:1.3;
color:#1a0dab;
text-decoration:none
}
.resultTitle:hover{text-decoration:underline}
.resultUrl{
margin:4px 0 4px 26px;
overflow:hidden;
color:#188038;
font-size:13px;
text-overflow:ellipsis;
white-space:nowrap
}
.resultDesc{
margin:0 0 0 26px;
color:#4d5156;
font-size:14px;
line-height:1.52
}

.knowledge{
display:none;
align-self:start;
padding-left:23px;
border-left:1px solid #e3e3e3
}
.knowledge.active{display:block}
.kLabel{
margin-bottom:11px;
color:#777;
font-size:11px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase
}
.knowledge h2{
margin:0 0 5px;
font-size:23px
}
.kSource{
margin-bottom:13px;
color:#777;
font-size:12px
}
.kImage{
display:block;
width:100%;
max-height:210px;
margin:0 0 13px;
border-radius:7px;
object-fit:cover
}
.kText{
margin:0 0 12px;
color:#444;
font-size:14px;
line-height:1.55
}
.kLink{
color:#1a0dab;
font-size:13px;
text-decoration:none
}

.tool{
margin-bottom:17px;
padding:14px;
border:1px solid #e2e2e2;
border-radius:7px
}
.toolName{
margin-bottom:7px;
font-size:12px;
font-weight:700
}
.toolValue{font-size:22px}
.toolInfo{
margin-top:4px;
color:#666;
font-size:13px
}

.imageGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-bottom:28px
}
.imageGrid img{
width:100%;
height:105px;
border-radius:5px;
object-fit:cover
}

}

</style>
</head>

<body>

<header>
<div class="bar">

<a class="logo" href="/TraceBreak/">TraceBreak</a>

<div class="searchWrap">

<form class="search" id="searchForm">

<input
id="queryInput"
type="search"
autocomplete="off"
spellcheck="false"
aria-label="Search"
>

<button type="submit">Search</button>

</form>

<div id="suggestions" class="suggestions"></div>

</div>

<div class="controls">
<button id="rubToggle" class="control" type="button">RubMode</button>
</div>

</div>
</header>

<main class="layout">

<section>

<div id="status" class="status">Ready</div>

<div id="correction" class="correction"></div>

<div id="tools"></div>

<div id="images"></div>

<div id="results"></div>

</section>

<aside id="knowledge" class="knowledge">

<div class="kLabel">Knowledge</div>

<div id="knowledgeBody"></div>

</aside>

</main>

<script>
"use strict";

const BASE="/TraceBreak/";
const SUPABASE="https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/";

const params=new URLSearchParams(location.search);
const query=(params.get("q")||"").trim();

const input=document.getElementById("queryInput");
const form=document.getElementById("searchForm");
const suggestions=document.getElementById("suggestions");
const status=document.getElementById("status");
const correction=document.getElementById("correction");
const results=document.getElementById("results");
const tools=document.getElementById("tools");
const images=document.getElementById("images");
const knowledge=document.getElementById("knowledge");
const knowledgeBody=document.getElementById("knowledgeBody");
const rubToggle=document.getElementById("rubToggle");

const startTime=performance.now();

input.value=query;

let seen=new Set();
let knowledgeShown=false;
let suggestionController=null;

function encodeQuery(value){

return String(value||"")
.trim()
.split(/\s+/)
.map(encodeURIComponent)
.join("+");

}

function search(value){

const q=String(value||"").trim();

if(!q)return;

location.href=
BASE+
"search.html?q="+
encodeQuery(q);

}

form.addEventListener("submit",function(e){

e.preventDefault();
search(input.value);

});

function elapsed(){

return Math.round(performance.now()-startTime);

}

function updateStatus(){

const count=document.querySelectorAll(".result").length;

if(count){
status.textContent=
count+
(count===1?" result":" results")+
" · "+
elapsed()+
" ms";
}else{
status.textContent=
"Searching · "+
elapsed()+
" ms";
}

}

function canonical(url){

try{

const u=new URL(url);

u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid",
"dclid"
].forEach(function(k){
u.searchParams.delete(k);
});

return u.href;

}catch{
return String(url);
}

}

function favicon(url){

try{

const host=new URL(url).hostname;

const img=document.createElement("img");

img.className="favicon";
img.alt="";
img.loading="lazy";

img.src=
"https://www.google.com/s2/favicons?sz=32&domain="+
encodeURIComponent(host);

img.onerror=function(){

img.style.display="none";

};

return img;

}catch{

return null;

}

}

function cleanText(value){

return String(value||"")
.replace(/<[^>]*>/g," ")
.replace(/\s+/g," ")
.trim()
.replace(
/^(summary|overview|highlights|notes|description)\s*:\s*/i,
""
)
.slice(0,360);

}

function addResult(item){

if(!item||typeof item!=="object")return;

const url=
item.url||
item.link||
item.href;

if(!url)return;

const key=canonical(url);

if(seen.has(key))return;

seen.add(key);

const article=document.createElement("article");
article.className="result";

const head=document.createElement("div");
head.className="resultHead";

const icon=
item.favicon?
Object.assign(document.createElement("img"),{
className:"favicon",
alt:"",
loading:"lazy",
src:item.favicon
}):
favicon(url);

if(icon)head.appendChild(icon);

const title=document.createElement("a");

title.className="resultTitle";
title.href=url;
title.target="_blank";
title.rel="noopener noreferrer";
title.textContent=
item.title||
item.name||
url;

head.appendChild(title);

const urlNode=document.createElement("div");

urlNode.className="resultUrl";
urlNode.textContent=url;

const description=document.createElement("p");

description.className="resultDesc";
description.textContent=cleanText(
item.description||
item.snippet||
item.content||
""
);

article.append(
head,
urlNode,
description
);

results.appendChild(article);

updateStatus();

}

function addResults(list){

if(!Array.isArray(list))return;

for(const item of list){
addResult(item);
}

}

function showCorrection(value){

const text=String(value||"").trim();

if(!text||text.toLowerCase()===query.toLowerCase()){
return;
}

correction.replaceChildren();

correction.appendChild(
document.createTextNode("Showing results for ")
);

const link=document.createElement("a");

link.href=
BASE+
"search.html?q="+
encodeQuery(text);

link.textContent=text;

correction.appendChild(link);
correction.classList.add("active");

}

function showKnowledge(data,source){

if(knowledgeShown||!data)return;

const title=String(data.title||"").trim();
const description=cleanText(data.description||"");
const image=data.image||"";
const url=data.url||"";

if(!title&&!description)return;

knowledgeShown=true;

knowledgeBody.replaceChildren();

const h2=document.createElement("h2");

h2.textContent=title||query;

const sourceText=document.createElement("div");

sourceText.className="kSource";
sourceText.textContent=source;

knowledgeBody.append(h2,sourceText);

if(image){

const img=document.createElement("img");

img.className="kImage";
img.alt=title||query;
img.loading="eager";
img.decoding="async";
img.src=image;

img.onerror=function(){

img.remove();

};

knowledgeBody.appendChild(img);

}

if(description){

const p=document.createElement("p");

p.className="kText";
p.textContent=description;

knowledgeBody.appendChild(p);

}

if(url){

const link=document.createElement("a");

link.className="kLink";
link.href=url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Read more";

knowledgeBody.appendChild(link);

}

knowledge.classList.add("active");

}

async function wikipedia(){

if(!query)return;

try{

const searchURL=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&list=search"+
"&srsearch="+
encodeURIComponent(query)+
"&srlimit=1"+
"&srnamespace=0"+
"&format=json"+
"&origin=*";

const response=await fetch(
searchURL,
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

const hit=
data.query&&
data.query.search&&
data.query.search[0];

if(!hit)return;

const title=hit.title;

const summaryURL=
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(title);

const summaryResponse=await fetch(
summaryURL,
{
headers:{
"Accept":"application/json"
},
cache:"no-store"
}
);

if(!summaryResponse.ok)return;

const page=await summaryResponse.json();

const image=
page.thumbnail&&
page.thumbnail.source||
page.originalimage&&
page.originalimage.source||
"";

const pageURL=
page.content_urls&&
page.content_urls.desktop&&
page.content_urls.desktop.page||
"https://en.wikipedia.org/wiki/"+
encodeURIComponent(title.replace(/ /g,"_"));

showKnowledge({
title:page.displaytitle||page.title||title,
description:page.extract||"",
image:image,
url:pageURL
},"Wikipedia");

}catch(error){

console.debug("Wikipedia:",error);

}

}

async function duckDuckGo(){

if(!query)return;

try{

const url=
"https://api.duckduckgo.com/"+
"?q="+encodeURIComponent(query)+
"&format=json"+
"&no_html=1"+
"&skip_disambig=1";

const response=await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

if(!data.AbstractText)return;

showKnowledge({
title:data.Heading||query,
description:data.AbstractText,
image:data.Image||"",
url:data.AbstractURL||""
},"DuckDuckGo");

}catch(error){

console.debug("DDG:",error);

}

}

async function tracebreak(){

try{

const url=
SUPABASE+
"tracebreak-search-fast?q="+
encodeQuery(query)+
"&limit=100";

const response=await fetch(
url,
{
headers:{
"Accept":"application/json"
},
cache:"no-store"
}
);

if(!response.ok){

console.debug(
"TraceBreak HTTP",
response.status
);

return;

}

const data=await response.json();

if(data.corrected_query){
showCorrection(data.corrected_query);
}

addResults(
data.results||
data.documents||
[]
);

}catch(error){

console.debug("TraceBreak:",error);

}

}

async function search360(){

try{

const url=
"https://api.360-search.com/"+
"?q="+
encodeQuery(query)+
"&type=web"+
"&safe=moderate"+
"&limit=30";

const response=await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

addResults(data.results||[]);

}catch(error){

console.debug("360:",error);

}

}

async function images360(){

try{

const url=
"https://api.360-search.com/"+
"?q="+
encodeQuery(query)+
"&type=image"+
"&safe=moderate"+
"&limit=12";

const response=await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

const list=
Array.isArray(data.results)?
data.results:
[];

if(!list.length)return;

const grid=document.createElement("div");

grid.className="imageGrid";

for(const item of list){

const src=
item.image||
item.thumbnail;

if(!src)continue;

const img=document.createElement("img");

img.src=src;
img.alt=item.title||"";
img.loading="lazy";
img.decoding="async";

img.onerror=function(){
img.remove();
};

grid.appendChild(img);

}

if(grid.children.length){
images.appendChild(grid);
}

}catch(error){

console.debug("Images:",error);

}

}

async function youSearch(){

try{

const url=
SUPABASE+
"tracebreak-meta-fast"+
"?provider=you"+
"&q="+
encodeQuery(query)+
"&limit=30";

const response=await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

const provider=
data.providers&&
data.providers.you;

if(provider){

addResults(
provider.results||
provider.web||
[]
);

}

}catch(error){

console.debug("You:",error);

}

}

function calculator(){

if(
!/^[0-9+\-*/().%\s]+$/.test(query)||
!/[+\-*/%]/.test(query)
)return;

try{

const value=Function(
'"use strict";return ('+
query+
')'
)();

if(!Number.isFinite(value))return;

addTool(
"Calculator",
String(value)
);

}catch(error){

console.debug("Calculator:",error);

}

}

function addTool(name,value,info){

const box=document.createElement("div");

box.className="tool";

const title=document.createElement("div");

title.className="toolName";
title.textContent=name;

const output=document.createElement("div");

output.className="toolValue";
output.textContent=value;

box.append(title,output);

if(info){

const detail=document.createElement("div");

detail.className="toolInfo";
detail.textContent=info;

box.appendChild(detail);

}

tools.appendChild(box);

}

function conversion(){

const match=query.match(
/^(-?[\d,.]+)\s*(km|mi|m|ft|kg|lb|g|oz|c|f|°c|°f)$/i
);

if(!match)return;

const n=Number(
match[1].replace(/,/g,"")
);

const unit=match[2].toLowerCase();

let output="";

switch(unit){

case"km":
output=(n*.621371).toFixed(4)+" mi";
break;

case"mi":
output=(n*1.609344).toFixed(4)+" km";
break;

case"m":
output=(n*3.28084).toFixed(4)+" ft";
break;

case"ft":
output=(n*.3048).toFixed(4)+" m";
break;

case"kg":
output=(n*2.2046226218).toFixed(4)+" lb";
break;

case"lb":
output=(n*.45359237).toFixed(4)+" kg";
break;

case"g":
output=(n*.035273962).toFixed(4)+" oz";
break;

case"oz":
output=(n*28.349523125).toFixed(4)+" g";
break;

case"c":
case"°c":
output=(n*9/5+32).toFixed(2)+" °F";
break;

case"f":
case"°f":
output=((n-32)*5/9).toFixed(2)+" °C";
break;

}

if(output){
addTool("Conversion",output);
}

}

async function weather(){

const match=query.match(
/^(?:weather|temperature|forecast)\s+(?:in|for|at)\s+(.+)$/i
);

if(!match)return;

try{

const location=match[1];

const geo=
"https://geocoding-api.open-meteo.com/v1/search"+
"?name="+encodeURIComponent(location)+
"&count=1"+
"&language=en"+
"&format=json";

const geoResponse=await fetch(
geo,
{
cache:"no-store"
}
);

if(!geoResponse.ok)return;

const geoData=await geoResponse.json();

const place=
geoData.results&&
geoData.results[0];

if(!place)return;

const weatherURL=
"https://api.open-meteo.com/v1/forecast"+
"?latitude="+place.latitude+
"&longitude="+place.longitude+
"&current=temperature_2m,wind_speed_10m";

const weatherResponse=await fetch(
weatherURL,
{
cache:"no-store"
}
);

if(!weatherResponse.ok)return;

const data=await weatherResponse.json();

if(!data.current)return;

addTool(
"Weather · "+place.name,
Math.round(
data.current.temperature_2m
)+"°C",
"Wind "+
Math.round(
data.current.wind_speed_10m
)+" km/h"
);

}catch(error){

console.debug("Weather:",error);

}

}

function localSuggestions(q){

const list=[];
const add=value=>{

value=String(value||"").trim();

if(
value&&
!list.some(
x=>x.toLowerCase()===value.toLowerCase()
)
){
list.push(value);
}

};

add(q);

const words=q.toLowerCase().split(/\s+/);

if(words.length===1){

const w=words[0];

add(w+" wikipedia");
add(w+" definition");
add(w+" history");
add(w+" official website");
add(w+" news");

if(
["math","algebra","geometry","calculus"].includes(w)
){
add(w+" calculator");
add(w+" formulas");
}

if(
["weather","forecast","temperature"].includes(w)
){
add("weather today");
add("weather tomorrow");
}

}else{

add(q+" wikipedia");

if(/weather/i.test(q)){
add(q+" forecast");
}

if(/news/i.test(q)){
add(q+" latest");
}

}

return list.slice(0,8);

}

function renderSuggestions(list){

suggestions.replaceChildren();

if(!list.length){

suggestions.classList.remove("active");
return;

}

for(const value of list){

const button=document.createElement("button");

button.type="button";
button.className="suggestion";

const icon=document.createElement("span");

icon.className="suggestionIcon";
icon.textContent="⌕";

const text=document.createElement("span");

text.className="suggestionText";
text.textContent=value;

button.append(icon,text);

button.addEventListener(
"mousedown",
function(e){
e.preventDefault();
search(value);
}
);

suggestions.appendChild(button);

}

suggestions.classList.add("active");

}

async function suggestionsForQuery(){

const q=input.value.trim();

if(!q){

suggestions.classList.remove("active");
return;

}

if(suggestionController){
suggestionController.abort();
}

suggestionController=new AbortController();

const local=localSuggestions(q);

renderSuggestions(local);

try{

const url=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&list=search"+
"&srsearch="+encodeURIComponent(q)+
"&srlimit=6"+
"&srnamespace=0"+
"&format=json"+
"&origin=*";

const response=await fetch(
url,
{
signal:suggestionController.signal,
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

if(input.value.trim()!==q)return;

const merged=[
...local,
...(data.query&&data.query.search||[])
.map(x=>x.title)
];

const unique=[];
const keys=new Set();

for(const value of merged){

const key=value.toLowerCase();

if(keys.has(key))continue;

keys.add(key);
unique.push(value);

}

renderSuggestions(unique.slice(0,8));

}catch(error){

if(error.name!=="AbortError"){
console.debug("Suggestions:",error);
}

}

}

let suggestionDelay;

input.addEventListener("input",function(){

clearTimeout(suggestionDelay);

suggestionDelay=setTimeout(
suggestionsForQuery,
150
);

});

input.addEventListener("focus",function(){

if(input.value.trim()){
suggestionsForQuery();
}

});

document.addEventListener("click",function(e){

if(!e.target.closest(".searchWrap")){
suggestions.classList.remove("active");
}

});

rubToggle.addEventListener("click",function(){

const enabled=
document.body.classList.toggle("rubmode");

rubToggle.textContent=
enabled?"NormalMode":"RubMode";

localStorage.setItem(
"tracebreak-rubmode",
enabled?"1":"0"
);

});

if(
localStorage.getItem("tracebreak-rubmode")==="1"
){

document.body.classList.add("rubmode");
rubToggle.textContent="NormalMode";

}

function run(){

if(!query){

status.textContent="Enter a search query.";
return;

}

status.textContent=
"Searching · "+
elapsed()+
" ms";

/*
Everything intentionally starts independently.
Nothing waits for 360, You, Wikipedia, DDG,
weather, images, or another provider.
*/

void tracebreak();
void wikipedia();
void duckDuckGo();

calculator();
conversion();
void weather();

void search360();
void images360();
void youSearch();

updateStatus();

}

run();
</script>
