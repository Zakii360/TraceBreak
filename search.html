<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceBreak Search</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23202124'/%3E%3Cpath d='M17 17h30v7H25v7h16v7H25v8h22v7H17z' fill='white'/%3E%3C/svg%3E">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:#fff;
color:#202124;
font-family:Arial,Helvetica,sans-serif
}
header{
position:sticky;
top:0;
z-index:50;
background:rgba(255,255,255,.97);
border-bottom:1px solid #e5e5e5
}
.bar{
width:min(1120px,calc(100% - 32px));
min-height:66px;
margin:auto;
display:flex;
align-items:center;
gap:18px
}
.logo{
color:#111;
font-size:20px;
font-weight:700;
letter-spacing:-.7px;
text-decoration:none;
white-space:nowrap
}
.searchWrap{
position:relative;
width:min(700px,100%);
flex:1
}
.search{
display:flex;
width:100%
}
.search input{
width:100%;
height:40px;
padding:0 13px;
border:1px solid #c8c8c8;
border-right:0;
border-radius:6px 0 0 6px;
outline:none;
font-size:15px
}
.search input:focus{border-color:#777}
.search button{
height:40px;
padding:0 18px;
border:0;
border-radius:0 6px 6px 0;
background:#202124;
color:#fff;
cursor:pointer
}
.controls{display:flex;gap:7px}
.control{
height:34px;
padding:0 11px;
border:1px solid #ccc;
border-radius:5px;
background:#fff;
color:#333;
cursor:pointer
}
.suggestions{
position:absolute;
top:45px;
left:0;
right:0;
display:none;
overflow:hidden;
background:#fff;
border:1px solid #ddd;
border-radius:7px;
box-shadow:0 8px 25px rgba(0,0,0,.1);
z-index:100
}
.suggestions.active{display:block}
.suggestion{
display:flex;
align-items:center;
width:100%;
gap:9px;
padding:10px 13px;
border:0;
background:#fff;
color:#202124;
font:14px Arial,sans-serif;
text-align:left;
cursor:pointer
}
.suggestion:hover{background:#f3f3f3}
.suggestionIcon{width:16px;color:#777}
.suggestionText{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.layout{
width:min(1120px,calc(100% - 32px));
margin:25px auto 80px;
display:grid;
grid-template-columns:minmax(0,750px) 310px;
gap:50px
}

.status{
margin-bottom:12px;
color:#777;
font-size:13px
}

.correction{
display:none;
margin:-4px 0 20px;
font-size:13px;
color:#555
}
.correction.active{display:block}
.correction a{
color:#1a0dab;
text-decoration:none
}

.result{
margin-bottom:27px;
animation:resultIn .12s ease-out
}
@keyframes resultIn{
from{opacity:0;transform:translateY(3px)}
to{opacity:1;transform:none}
}

.resultHead{
display:flex;
align-items:flex-start;
gap:8px
}
.favicon{
width:18px;
height:18px;
margin-top:4px;
object-fit:contain;
flex:none
}
.resultTitle{
font-size:18px;
line-height:1.3;
color:#1a0dab;
text-decoration:none
}
.resultTitle:hover{text-decoration:underline}
.resultUrl{
margin:4px 0 4px 26px;
overflow:hidden;
color:#188038;
font-size:13px;
text-overflow:ellipsis;
white-space:nowrap
}
.resultDesc{
margin:0 0 0 26px;
color:#4d5156;
font-size:14px;
line-height:1.52
}

.knowledge{
display:none;
align-self:start;
padding-left:23px;
border-left:1px solid #e3e3e3
}
.knowledge.active{display:block}
.kLabel{
margin-bottom:11px;
color:#777;
font-size:11px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase
}
.knowledge h2{
margin:0 0 5px;
font-size:23px;
line-height:1.2
}
.kSource{
margin-bottom:13px;
color:#777;
font-size:12px
}
.kImage{
display:block;
width:100%;
max-height:220px;
margin:0 0 13px;
border-radius:7px;
object-fit:cover
}
.kText{
margin:0 0 12px;
color:#444;
font-size:14px;
line-height:1.55
}
.kLink{
color:#1a0dab;
font-size:13px;
text-decoration:none
}

.tool{
margin-bottom:17px;
padding:14px;
border:1px solid #e2e2e2;
border-radius:7px
}
.toolName{
margin-bottom:7px;
font-size:12px;
font-weight:700
}
.toolValue{font-size:22px}
.toolInfo{
margin-top:4px;
color:#666;
font-size:13px
}

.imageGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-bottom:28px
}
.imageGrid img{
width:100%;
height:105px;
border-radius:5px;
object-fit:cover
}

body.rubmode{
background:#fff;
color:#000;
font-family:"Times New Roman",serif
}
body.rubmode header{
position:static;
background:#fff;
border:0
}
body.rubmode .bar{
width:auto;
min-height:40px;
padding:6px;
margin:0
}
body.rubmode .logo{
font-family:"Times New Roman",serif;
font-size:16px;
font-weight:normal
}
body.rubmode .search input{
width:300px;
height:20px;
border:1px solid #777;
border-radius:0;
font:13px Arial
}
body.rubmode .search button,
body.rubmode .control{
height:23px;
padding:1px 6px;
border:1px solid #777;
border-radius:0;
background:#eee;
color:#000;
font:13px Arial
}
body.rubmode .layout{
width:auto;
display:block;
margin:10px 6px
}
body.rubmode .resultTitle{
font-family:Arial,sans-serif;
font-size:16px
}
body.rubmode .knowledge{
padding-left:12px;
border-left:1px solid #777
}

@media(max-width:850px){
.layout{grid-template-columns:1fr}
.knowledge{
padding:20px 0 0;
border-left:0;
border-top:1px solid #ddd
}
}
</style>
</head>

<body>

<header>
<div class="bar">

<a class="logo" href="/TraceBreak/">TraceBreak</a>

<div class="searchWrap">

<form class="search" id="searchForm">

<input
id="queryInput"
type="search"
autocomplete="off"
spellcheck="false"
>

<button type="submit">Search</button>

</form>

<div id="suggestions" class="suggestions"></div>

</div>

<div class="controls">
<button id="rubToggle" class="control" type="button">
RubMode
</button>
</div>

</div>
</header>

<main class="layout">

<section>

<div id="status" class="status">
Ready
</div>

<div id="correction" class="correction"></div>

<div id="tools"></div>

<div id="images"></div>

<div id="results"></div>

</section>

<aside id="knowledge" class="knowledge">

<div class="kLabel">Knowledge</div>

<div id="knowledgeBody"></div>

</aside>

</main>

<script>
"use strict";

const BASE="/TraceBreak/";
const API="https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/";

const params=new URLSearchParams(location.search);
const query=(params.get("q")||"").trim();

const input=document.getElementById("queryInput");
const form=document.getElementById("searchForm");
const suggestions=document.getElementById("suggestions");
const status=document.getElementById("status");
const correction=document.getElementById("correction");
const results=document.getElementById("results");
const tools=document.getElementById("tools");
const images=document.getElementById("images");
const knowledge=document.getElementById("knowledge");
const knowledgeBody=document.getElementById("knowledgeBody");
const rubToggle=document.getElementById("rubToggle");

input.value=query;

const started=performance.now();

let resultItems=[];
let seenURLs=new Set();
let knowledgeShown=false;

function encodeQuery(q){
return String(q||"")
.trim()
.split(/\s+/)
.map(encodeURIComponent)
.join("+");
}

function go(q){
q=String(q||"").trim();
if(!q)return;

location.href=
BASE+
"search.html?q="+
encodeQuery(q);
}

form.addEventListener("submit",e=>{
e.preventDefault();
go(input.value);
});

function elapsed(){
return Math.round(performance.now()-started);
}

function updateStatus(){
const n=resultItems.length;

status.textContent=
n+
(n===1?" result":" results")+
" · "+
elapsed()+
" ms";
}

function canonical(url){

try{
const u=new URL(url);
u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid"
].forEach(k=>u.searchParams.delete(k));

return u.href;

}catch{
return String(url);
}

}

function cleanText(value){

return String(value||"")
.replace(/<[^>]*>/g," ")
.replace(/\s+/g," ")
.trim()
.replace(
/^(summary|overview|highlights|notes|description)\s*:\s*/i,
""
)
.slice(0,600);

}

function faviconFor(url){

try{

const host=new URL(url).hostname;

const img=document.createElement("img");

img.className="favicon";
img.alt="";
img.loading="lazy";

img.src=
"https://www.google.com/s2/favicons?sz=32&domain="+
encodeURIComponent(host);

img.onerror=()=>{
img.style.display="none";
};

return img;

}catch{
return null;
}

}

function normalizeResult(item){

if(!item||typeof item!=="object")return null;

const url=
item.url||
item.link||
item.href;

if(!url)return null;

return {
id:item.id||null,
url:String(url),
canonical_url:item.canonical_url||String(url),
title:item.title||item.name||String(url),
description:
item.description||
item.snippet||
item.content||
"",
domain:item.domain||"",
language:item.language||"",
pagerank:Number(item.pagerank)||0,
quality_score:Number(item.quality_score)||0,
freshness_score:Number(item.freshness_score)||0,
score:Number(item.score)||0
};

}

function addResult(item){

const x=normalizeResult(item);

if(!x)return;

const key=canonical(x.url);

if(seenURLs.has(key))return;

seenURLs.add(key);

resultItems.push(x);

const article=document.createElement("article");

article.className="result";

const head=document.createElement("div");

head.className="resultHead";

const icon=x.favicon?
Object.assign(
document.createElement("img"),
{
className:"favicon",
alt:"",
loading:"lazy",
src:x.favicon
}
):
faviconFor(x.url);

if(icon)head.appendChild(icon);

const title=document.createElement("a");

title.className="resultTitle";
title.href=x.url;
title.target="_blank";
title.rel="noopener noreferrer";
title.textContent=cleanText(x.title);

head.appendChild(title);

const url=document.createElement("div");

url.className="resultUrl";
url.textContent=x.url;

const desc=document.createElement("p");

desc.className="resultDesc";
desc.textContent=cleanText(x.description);

article.append(
head,
url,
desc
);

results.appendChild(article);

updateStatus();

}

function addResults(list){

if(!Array.isArray(list))return;

for(const x of list)addResult(x);

}

async function cacheResults(){

if(!query||!resultItems.length)return;

try{

await fetch(
API+"tracebreak-search-fast",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
q:query,
results:resultItems
}),
keepalive:true
}
);

}catch(error){
console.debug("cache:",error);
}

}

async function localSearch(){

try{

const url=
API+
"tracebreak-search-fast?q="+
encodeQuery(query)+
"&limit=100";

const response=await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok){

console.debug(
"TraceBreak:",
response.status
);

return;
}

const data=await response.json();

if(data.results){

addResults(data.results);

}

if(data.corrected_query){
showCorrection(data.corrected_query);
}

}catch(error){

console.debug("TraceBreak:",error);

}

}

function showCorrection(value){

if(!value)return;

if(
String(value).toLowerCase()===
query.toLowerCase()
)return;

correction.replaceChildren();

correction.append(
document.createTextNode("Showing results for ")
);

const link=document.createElement("a");

link.href=
BASE+
"search.html?q="+
encodeQuery(value);

link.textContent=value;

correction.appendChild(link);

correction.classList.add("active");

}

async function wikipedia(){

if(!query)return;

try{

const searchURL=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&list=search"+
"&srsearch="+
encodeURIComponent(query)+
"&srlimit=1"+
"&srnamespace=0"+
"&format=json"+
"&origin=*";

const searchResponse=await fetch(
searchURL,
{
cache:"no-store"
}
);

if(!searchResponse.ok)return;

const searchData=await searchResponse.json();

const hit=
searchData?.query?.search?.[0];

if(!hit)return;

const title=hit.title;
const pageId=hit.pageid;

const summaryURL=
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(
title.replace(/\s+/g,"_")
);

const imageURL=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&pageids="+
encodeURIComponent(pageId)+
"&prop=pageimages"+
"&piprop=thumbnail|original"+
"&pithumbsize=700"+
"&format=json"+
"&origin=*";

const [summaryResponse,imageResponse]=
await Promise.all([
fetch(
summaryURL,
{
cache:"no-store"
}
),
fetch(
imageURL,
{
cache:"no-store"
}
)
]);

if(!summaryResponse.ok)return;

const page=await summaryResponse.json();

let image=
page?.thumbnail?.source||
page?.originalimage?.source||
"";

if(imageResponse.ok){

const imageData=
await imageResponse.json();

const pageInfo=
imageData?.query?.pages?.[pageId];

image=
pageInfo?.thumbnail?.source||
pageInfo?.original?.source||
image||
"";

}

if(!image){

image=await wikipediaImageSearch(query);

}

const pageURL=
page?.content_urls?.desktop?.page||
"https://en.wikipedia.org/wiki/"+
encodeURIComponent(title.replace(/ /g,"_"));

showKnowledge({
title:page.title||title,
description:page.extract||"",
image,
url:pageURL
},"Wikipedia");

}catch(error){

console.debug("Wikipedia:",error);

}

}

async function wikipediaImageSearch(q){

try{

const url=
"https://commons.wikimedia.org/w/api.php"+
"?action=query"+
"&generator=search"+
"&gsrsearch="+
encodeURIComponent(q)+
"&gsrnamespace=6"+
"&gsrlimit=1"+
"&prop=imageinfo"+
"&iiprop=url"+
"&iiurlwidth=700"+
"&format=json"+
"&origin=*";

const response=await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)return"";

const data=await response.json();

const pages=
data?.query?.pages;

if(!pages)return"";

const page=
Object.values(pages)[0];

return page?.imageinfo?.[0]?.thumburl||
page?.imageinfo?.[0]?.url||
"";

}catch{
return"";
}

}

function showKnowledge(data,source){

if(knowledgeShown||!data)return;

const title=
cleanText(data.title);

const description=
cleanText(data.description);

if(!title&&!description)return;

knowledgeShown=true;

knowledgeBody.replaceChildren();

const h2=document.createElement("h2");

h2.textContent=title||query;

const src=document.createElement("div");

src.className="kSource";
src.textContent=source;

knowledgeBody.append(
h2,
src
);

if(data.image){

const img=document.createElement("img");

img.className="kImage";
img.alt=title;
img.loading="eager";
img.decoding="async";
img.src=data.image;

img.onerror=()=>{
img.remove();
};

knowledgeBody.appendChild(img);

}

if(description){

const p=document.createElement("p");

p.className="kText";
p.textContent=description;

knowledgeBody.appendChild(p);

}

if(data.url){

const a=document.createElement("a");

a.className="kLink";
a.href=data.url;
a.target="_blank";
a.rel="noopener noreferrer";
a.textContent="Read more";

knowledgeBody.appendChild(a);

}

knowledge.classList.add("active");

}

async function duckDuckGo(){

/*
DDG blocks direct browser CORS requests on many deployments,
so use the existing Supabase instant knowledge proxy.
*/

try{

const response=await fetch(
API+
"tracebreak-instant-v2?q="+
encodeQuery(query),
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

if(
data.wikipedia&&
!knowledgeShown
){

showKnowledge(
data.wikipedia,
"Wikipedia"
);

}

if(
data.duckduckgo&&
!knowledgeShown
){

showKnowledge(
data.duckduckgo,
"DuckDuckGo"
);

}

}catch(error){

console.debug("Knowledge proxy:",error);

}

}

async function search360(){

try{

const response=await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=web"+
"&safe=moderate"+
"&limit=30",
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

addResults(data.results||[]);

await cacheResults();

}catch(error){

console.debug("360:",error);

}

}

async function imageSearch(){

try{

const response=await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=image"+
"&safe=moderate"+
"&limit=12",
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

const grid=document.createElement("div");

grid.className="imageGrid";

for(const item of data.results||[]){

const src=
item.image||
item.thumbnail;

if(!src)continue;

const img=document.createElement("img");

img.src=src;
img.alt=item.title||"";
img.loading="lazy";
img.decoding="async";

img.onerror=()=>{
img.remove();
};

grid.appendChild(img);

}

if(grid.children.length){

images.appendChild(grid);

}

}catch(error){

console.debug("Images:",error);

}

}

async function calculator(){

if(
!/^[0-9+\-*/().%\s]+$/.test(query)||
!/[+\-*/%]/.test(query)
)return;

try{

const value=Function(
'"use strict";return ('+
query+
')'
)();

if(Number.isFinite(value)){

addTool(
"Calculator",
String(value)
);

}

}catch{}

}

function addTool(name,value,info){

const box=document.createElement("div");

box.className="tool";

const title=document.createElement("div");

title.className="toolName";
title.textContent=name;

const output=document.createElement("div");

output.className="toolValue";
output.textContent=value;

box.append(
title,
output
);

if(info){

const detail=document.createElement("div");

detail.className="toolInfo";
detail.textContent=info;

box.appendChild(detail);

}

tools.appendChild(box);

}

function conversion(){

const m=query.match(
/^(-?[\d,.]+)\s*(km|mi|m|ft|kg|lb|g|oz|c|f|°c|°f)$/i
);

if(!m)return;

const n=Number(
m[1].replace(/,/g,"")
);

const unit=m[2].toLowerCase();

let value="";

switch(unit){

case"km":
value=(n*.621371).toFixed(4)+" mi";
break;

case"mi":
value=(n*1.609344).toFixed(4)+" km";
break;

case"m":
value=(n*3.28084).toFixed(4)+" ft";
break;

case"ft":
value=(n*.3048).toFixed(4)+" m";
break;

case"kg":
value=(n*2.2046226218).toFixed(4)+" lb";
break;

case"lb":
value=(n*.45359237).toFixed(4)+" kg";
break;

case"g":
value=(n*.035273962).toFixed(4)+" oz";
break;

case"oz":
value=(n*28.349523125).toFixed(4)+" g";
break;

case"c":
case"°c":
value=(n*9/5+32).toFixed(2)+" °F";
break;

case"f":
case"°f":
value=((n-32)*5/9).toFixed(2)+" °C";
break;

}

if(value)addTool("Conversion",value);

}

async function weather(){

const m=query.match(
/^(?:weather|temperature|forecast)\s+(?:in|for|at)\s+(.+)$/i
);

if(!m)return;

try{

const geoResponse=await fetch(
"https://geocoding-api.open-meteo.com/v1/search"+
"?name="+
encodeURIComponent(m[1])+
"&count=1"+
"&language=en"+
"&format=json",
{
cache:"no-store"
}
);

if(!geoResponse.ok)return;

const geo=await geoResponse.json();
const place=geo?.results?.[0];

if(!place)return;

const response=await fetch(
"https://api.open-meteo.com/v1/forecast"+
"?latitude="+place.latitude+
"&longitude="+place.longitude+
"&current=temperature_2m,wind_speed_10m",
{
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

if(!data.current)return;

addTool(
"Weather · "+place.name,
Math.round(data.current.temperature_2m)+"°C",
"Wind "+
Math.round(data.current.wind_speed_10m)+
" km/h"
);

}catch(error){

console.debug("Weather:",error);

}

}

function addSuggestion(q){

const b=document.createElement("button");

b.type="button";
b.className="suggestion";

const icon=document.createElement("span");

icon.className="suggestionIcon";
icon.textContent="⌕";

const text=document.createElement("span");

text.className="suggestionText";
text.textContent=q;

b.append(
icon,
text
);

b.addEventListener(
"mousedown",
e=>{
e.preventDefault();
go(q);
}
);

suggestions.appendChild(b);

}

function localSuggestions(q){

const list=[];
const add=x=>{
x=String(x||"").trim();

if(
x&&
!list.some(
y=>y.toLowerCase()===x.toLowerCase()
)
){
list.push(x);
}

};

add(q);

if(!q.includes(" ")){

add(q+" wikipedia");
add(q+" definition");
add(q+" history");
add(q+" official website");
add(q+" news");

}else{

add(q+" wikipedia");

if(/weather/i.test(q))
add(q+" forecast");

if(/news/i.test(q))
add(q+" latest");

}

return list.slice(0,8);

}

function renderSuggestions(list){

suggestions.replaceChildren();

for(const q of list)
addSuggestion(q);

if(list.length)
suggestions.classList.add("active");
else
suggestions.classList.remove("active");

}

let suggestionTimer;

input.addEventListener(
"input",
()=>{

clearTimeout(suggestionTimer);

suggestionTimer=setTimeout(
async()=>{

const q=input.value.trim();

if(!q){

suggestions.classList.remove("active");
return;

}

const local=localSuggestions(q);

renderSuggestions(local);

},
100
);

});

document.addEventListener(
"click",
e=>{

if(!e.target.closest(".searchWrap"))
suggestions.classList.remove("active");

});

rubToggle.addEventListener(
"click",
()=>{

const enabled=
document.body.classList.toggle("rubmode");

rubToggle.textContent=
enabled?
"NormalMode":
"RubMode";

localStorage.setItem(
"tracebreak-rubmode",
enabled?"1":"0"
);

});

if(
localStorage.getItem("tracebreak-rubmode")==="1"
){

document.body.classList.add("rubmode");
rubToggle.textContent="NormalMode";

}

async function run(){

if(!query){

status.textContent="Enter a search query.";
return;

}

/*
IMPORTANT:
None of these awaits another provider.
Local search, knowledge, images,
360, weather, etc. all start independently.
*/

void localSearch();

void wikipedia();

void duckDuckGo();

void search360();

void imageSearch();

void calculator();

void conversion();

void weather();

updateStatus();

}

run();

</script>
