<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceBreak</title>
<link rel="icon" href="/TraceBreak/favicon.svg">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0
}

body{
background:#fff;
color:#202124;
font-family:Arial,Helvetica,sans-serif
}

header{
border-bottom:1px solid #e5e5e5;
background:#fff;
position:sticky;
top:0;
z-index:10
}

.bar{
width:min(1100px,calc(100% - 32px));
margin:auto;
min-height:64px;
display:flex;
align-items:center;
gap:22px
}

.logo{
font-weight:700;
font-size:20px;
color:#111;
text-decoration:none;
white-space:nowrap
}

.search{
display:flex;
flex:1;
max-width:720px
}

.search input{
height:40px;
flex:1;
padding:0 13px;
border:1px solid #c8c8c8;
border-right:0;
border-radius:6px 0 0 6px;
outline:none;
font-size:15px
}

.search input:focus{
border-color:#777
}

.search button{
height:40px;
border:0;
padding:0 18px;
background:#202124;
color:#fff;
border-radius:0 6px 6px 0;
cursor:pointer
}

.rub{
height:36px;
padding:0 12px;
border:1px solid #ccc;
background:#fff;
color:#333;
border-radius:5px;
cursor:pointer;
white-space:nowrap
}

main{
width:min(1100px,calc(100% - 32px));
margin:25px auto 80px;
display:grid;
grid-template-columns:minmax(0,740px) 300px;
gap:48px
}

.status{
font-size:13px;
color:#777;
margin-bottom:23px
}

.result{
margin-bottom:27px
}

.resultHead{
display:flex;
gap:8px;
align-items:flex-start
}

.favicon{
width:18px;
height:18px;
object-fit:contain;
margin-top:4px;
flex:0 0 18px
}

.resultTitle{
font-size:18px;
line-height:1.3;
color:#1a0dab;
text-decoration:none
}

.resultTitle:hover{
text-decoration:underline
}

.resultUrl{
font-size:13px;
color:#188038;
margin:4px 0 4px 26px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.resultDesc{
font-size:14px;
line-height:1.5;
color:#4d5156;
margin:0 0 0 26px
}

.knowledge{
display:none;
border-left:1px solid #e4e4e4;
padding-left:22px
}

.knowledge.active{
display:block
}

.kLabel{
font-size:11px;
font-weight:700;
color:#777;
letter-spacing:.1em;
text-transform:uppercase;
margin-bottom:12px
}

.knowledge h2{
font-size:23px;
margin:0 0 5px
}

.kSource{
font-size:12px;
color:#777;
margin-bottom:13px
}

.kImage{
width:100%;
max-height:190px;
object-fit:cover;
border-radius:6px;
margin-bottom:13px
}

.kText{
font-size:14px;
line-height:1.55;
color:#444
}

.kLink{
font-size:13px;
color:#1a0dab;
text-decoration:none
}

.tool{
border:1px solid #e2e2e2;
border-radius:7px;
padding:14px;
margin-bottom:17px
}

.toolName{
font-size:12px;
font-weight:700;
margin-bottom:7px
}

.toolValue{
font-size:22px
}

.toolInfo{
font-size:13px;
color:#666;
margin-top:4px
}

.imageGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-bottom:28px
}

.imageGrid img{
width:100%;
height:105px;
object-fit:cover;
border-radius:5px
}

/* RubMode */

body.rubmode{
background:#fff;
color:#000;
font-family:"Times New Roman",serif
}

body.rubmode header{
position:static;
border:0;
background:#fff
}

body.rubmode .bar{
width:95%;
max-width:none;
min-height:80px;
gap:16px
}

body.rubmode .logo{
font-family:Georgia,serif;
font-size:22px
}

body.rubmode .search{
max-width:620px
}

body.rubmode .search input{
height:34px;
border:1px solid #777;
border-radius:0;
font-family:inherit;
font-size:16px
}

body.rubmode .search button{
height:34px;
border:1px solid #777;
border-left:0;
border-radius:0;
background:#eee;
color:#000;
font-family:inherit
}

body.rubmode .rub{
height:30px;
border:1px solid #777;
border-radius:0;
background:#eee;
color:#000;
font-family:inherit
}

body.rubmode main{
width:95%;
max-width:none;
display:grid;
grid-template-columns:minmax(0,760px) 300px;
gap:35px;
margin:15px auto 60px
}

body.rubmode .status{
color:#444;
margin-bottom:18px
}

body.rubmode .result{
margin-bottom:20px
}

body.rubmode .resultTitle{
font-family:Arial,Helvetica,sans-serif;
font-size:16px;
color:#00e;
text-decoration:underline
}

body.rubmode .resultUrl{
font-family:Arial,Helvetica,sans-serif;
color:#008000;
margin-left:24px
}

body.rubmode .resultDesc{
font-family:Arial,Helvetica,sans-serif;
color:#333;
margin-left:24px
}

body.rubmode .knowledge{
border-left:1px solid #aaa;
padding-left:15px
}

body.rubmode .tool{
border:1px solid #999;
border-radius:0;
padding:9px;
margin-bottom:12px
}

body.rubmode .imageGrid img{
border-radius:0
}

@media(max-width:850px){
main{
grid-template-columns:1fr
}

.knowledge{
border-left:0;
border-top:1px solid #ddd;
padding:20px 0 0
}
}

@media(max-width:650px){
.bar{
flex-wrap:wrap;
padding:10px 0
}

.search{
order:3;
flex-basis:100%
}

.imageGrid{
grid-template-columns:repeat(2,1fr)
}
}
</style>
</head>

<body>

<header>
<div class="bar">

<a class="logo" href="/TraceBreak/">TraceBreak</a>

<form class="search" id="searchForm">
<input id="queryInput" type="search" autocomplete="off" spellcheck="true">
<button>Search</button>
</form>

<button class="rub" id="rubToggle">RubMode</button>

</div>
</header>

<main>

<section>

<div class="status" id="status">Searching...</div>

<div id="tools"></div>
<div id="images"></div>
<div id="results"></div>

</section>

<aside class="knowledge" id="knowledge">
<div class="kLabel">Knowledge</div>
<div id="knowledgeBody"></div>
</aside>

</main>

<script>
const BASE="/TraceBreak/";
const SUPABASE="https://tvxugmumfvgnvjacwwfz.supabase.co/functions/v1/";

const params=new URLSearchParams(location.search);
const query=(params.get("q")||"").trim();

const input=document.getElementById("queryInput");
const status=document.getElementById("status");
const results=document.getElementById("results");
const tools=document.getElementById("tools");
const images=document.getElementById("images");
const knowledge=document.getElementById("knowledge");
const knowledgeBody=document.getElementById("knowledgeBody");
const rubToggle=document.getElementById("rubToggle");

const seen=new Set();
const started=performance.now();

input.value=query.replace(/\+/g," ");

function encodeQuery(value){

const text=value.trim();

if(text.includes("+")){
return encodeURIComponent(text).replace(/%20/g,"+");
}

return text
.split(/\s+/)
.map(encodeURIComponent)
.join("+");
}

document.getElementById("searchForm").addEventListener("submit",e=>{
e.preventDefault();

const value=input.value.trim();

if(!value)return;

location.href=
BASE+
"search.html?q="+
encodeQuery(value);
});

rubToggle.addEventListener("click",()=>{

document.body.classList.toggle("rubmode");

const enabled=
document.body.classList.contains("rubmode");

rubToggle.textContent=
enabled?
"NormalMode":
"RubMode";

localStorage.setItem(
"tracebreak-rubmode",
enabled?
"1":
"0"
);
});

if(localStorage.getItem("tracebreak-rubmode")==="1"){
document.body.classList.add("rubmode");
rubToggle.textContent="NormalMode";
}

function time(){
return Math.round(performance.now()-started);
}

function updateStatus(){

const count=
document.querySelectorAll(".result").length;

status.textContent=
count+
(count===1?" result":" results")+
" · "+
time()+
" ms";
}

function normalizeURL(url){

try{

const u=new URL(url);

u.hash="";

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"gclid",
"fbclid",
"msclkid",
"dclid"
].forEach(x=>u.searchParams.delete(x));

return u.toString();

}catch{

return String(url);
}
}

function favicon(url){

try{

const u=new URL(url);

const img=document.createElement("img");

img.className="favicon";
img.loading="lazy";
img.alt="";
img.src=u.origin+"/favicon.ico";

img.onerror=()=>{

const fallback=
"https://www.google.com/s2/favicons?sz=32&domain_url="+
encodeURIComponent(url);

if(img.src!==fallback){
img.src=fallback;
}else{
img.remove();
}
};

return img;

}catch{

return null;
}
}

function addResult(item){

if(!item)return false;

const url=
item.url||
item.link||
item.href;

if(!url)return false;

const key=normalizeURL(url);

if(seen.has(key))return false;

seen.add(key);

const result=document.createElement("article");
result.className="result";

const head=document.createElement("div");
head.className="resultHead";

const icon=
item.favicon?
Object.assign(document.createElement("img"),{
className:"favicon",
src:item.favicon,
alt:"",
loading:"lazy"
}):
favicon(url);

if(icon){

icon.onerror=()=>{

if(!icon.dataset.fallback){

icon.dataset.fallback="1";

icon.src=
"https://www.google.com/s2/favicons?sz=32&domain_url="+
encodeURIComponent(url);

}else{
icon.remove();
}
};
}

if(icon)head.appendChild(icon);

const title=document.createElement("a");

title.className="resultTitle";
title.href=url;
title.target="_blank";
title.rel="noopener noreferrer";

title.textContent=
item.title||
item.name||
url;

head.appendChild(title);

const urlNode=document.createElement("div");

urlNode.className="resultUrl";
urlNode.textContent=url;

const desc=document.createElement("p");

desc.className="resultDesc";

let text=
item.description||
item.snippet||
item.snippet_text||
"";

text=String(text)
.replace(/\s+/g," ")
.replace(/^(summary|highlights|notes|overview)\s*:\s*/i,"")
.trim();

if(text.length>340){
text=text.slice(0,337).trimEnd()+"...";
}

desc.textContent=text;

result.append(
head,
urlNode,
desc
);

results.appendChild(result);

updateStatus();

return true;
}

function addResults(list){

if(!Array.isArray(list))return;

for(const item of list){
addResult(item);
}
}

function showKnowledge(data,source){

if(
!data||
(!data.title&&!data.description)
)return;

knowledgeBody.replaceChildren();

const title=document.createElement("h2");
title.textContent=data.title||query;

const sourceNode=document.createElement("div");
sourceNode.className="kSource";
sourceNode.textContent=source;

knowledgeBody.append(
title,
sourceNode
);

if(data.image){

const img=document.createElement("img");

img.className="kImage";
img.src=data.image;
img.alt="";
img.loading="eager";

img.onerror=()=>img.remove();

knowledgeBody.appendChild(img);
}

if(data.description){

const text=document.createElement("p");

text.className="kText";
text.textContent=data.description;

knowledgeBody.appendChild(text);
}

if(data.url){

const link=document.createElement("a");

link.className="kLink";
link.href=data.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Read more";

knowledgeBody.appendChild(link);
}

knowledge.classList.add("active");
}

async function wikipedia(){

try{

const r=await fetch(
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&list=search"+
"&srsearch="+
encodeURIComponent(query)+
"&srnamespace=0"+
"&srlimit=1"+
"&format=json"+
"&origin=*",
{cache:"no-store"}
);

if(!r.ok)return;

const d=await r.json();

const match=d.query?.search?.[0];

if(!match)return;

const page=await fetch(
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(match.title),
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!page.ok)return;

const data=await page.json();

showKnowledge({
title:data.title,
description:data.extract,
image:
data.thumbnail?.source||
data.originalimage?.source,
url:data.content_urls?.desktop?.page
},"Wikipedia");

}catch(e){

console.debug(e);
}
}

async function duckduckgo(){

try{

const r=await fetch(
"https://api.duckduckgo.com/?q="+
encodeURIComponent(query)+
"&format=json"+
"&no_html=1"+
"&skip_disambig=1",
{cache:"no-store"}
);

if(!r.ok)return;

const d=await r.json();

if(
d.AbstractText&&
!knowledge.classList.contains("active")
){

showKnowledge({
title:d.Heading||query,
description:d.AbstractText,
image:d.Image,
url:d.AbstractURL
},"DuckDuckGo");
}

}catch(e){

console.debug(e);
}
}

function calculator(){

if(
!/^[0-9+\-*/().%\s]+$/.test(query)
)return;

try{

const value=
Function(
"\"use strict\";return("+query+")"
)();

if(!Number.isFinite(value))return;

const box=document.createElement("div");
box.className="tool";

const name=document.createElement("div");
name.className="toolName";
name.textContent="Calculator";

const answer=document.createElement("div");
answer.className="toolValue";
answer.textContent=String(value);

box.append(name,answer);
tools.appendChild(box);

}catch{}
}

function conversion(){

const match=query.match(
/^(-?[\d.,]+)\s*(km|mi|m|ft|kg|lb|g|oz|c|f|°c|°f)$/i
);

if(!match)return;

const n=Number(
match[1].replace(/,/g,"")
);

const u=match[2].toLowerCase();

let out="";

if(u==="km")out=(n*.621371).toFixed(4)+" mi";
else if(u==="mi")out=(n*1.609344).toFixed(4)+" km";
else if(u==="m")out=(n*3.28084).toFixed(4)+" ft";
else if(u==="ft")out=(n*.3048).toFixed(4)+" m";
else if(u==="kg")out=(n*2.2046226218).toFixed(4)+" lb";
else if(u==="lb")out=(n*.45359237).toFixed(4)+" kg";
else if(u==="g")out=(n*.035273962).toFixed(4)+" oz";
else if(u==="oz")out=(n*28.349523125).toFixed(4)+" g";
else if(u==="c"||u==="°c")out=(n*9/5+32).toFixed(2)+" °F";
else if(u==="f"||u==="°f")out=((n-32)*5/9).toFixed(2)+" °C";

if(!out)return;

const box=document.createElement("div");
box.className="tool";

const name=document.createElement("div");
name.className="toolName";
name.textContent="Conversion";

const value=document.createElement("div");
value.className="toolValue";
value.textContent=out;

box.append(name,value);
tools.appendChild(box);
}

async function weather(){

const m=query.match(
/^(?:weather|temperature|forecast)\s+(?:in|for|at)\s+(.+)$/i
);

if(!m)return;

try{

const geo=await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="+
encodeURIComponent(m[1])+
"&count=1&language=en&format=json",
{cache:"no-store"}
);

if(!geo.ok)return;

const g=await geo.json();
const place=g.results?.[0];

if(!place)return;

const r=await fetch(
"https://api.open-meteo.com/v1/forecast?latitude="+
place.latitude+
"&longitude="+
place.longitude+
"&current=temperature_2m,wind_speed_10m",
{cache:"no-store"}
);

if(!r.ok)return;

const d=await r.json();

const box=document.createElement("div");
box.className="tool";

const name=document.createElement("div");
name.className="toolName";
name.textContent="Weather · "+place.name;

const value=document.createElement("div");
value.className="toolValue";
value.textContent=
Math.round(d.current.temperature_2m)+"°C";

const info=document.createElement("div");
info.className="toolInfo";
info.textContent=
"Wind "+
Math.round(d.current.wind_speed_10m)+
" km/h";

box.append(name,value,info);
tools.appendChild(box);

}catch(e){

console.debug(e);
}
}

async function tracebreak(){

try{

const r=await fetch(
SUPABASE+
"tracebreak-search-fast?q="+
encodeQuery(query)+
"&limit=100",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

addResults(d.results||[]);

}catch(e){

console.debug("TraceBreak",e);
}
}

async function search360(){

try{

const r=await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=web"+
"&safe=moderate"+
"&limit=30",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

addResults(d.results||[]);

}catch(e){

console.debug("360",e);
}
}

async function you(){

try{

const r=await fetch(
SUPABASE+
"tracebreak-meta-fast?provider=you&q="+
encodeQuery(query)+
"&limit=30",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

const provider=
d.providers?.you;

if(provider){

addResults(
provider.results||
provider.web||
[]
);
}

}catch(e){

console.debug("You",e);
}
}

async function imageSearch(){

try{

const r=await fetch(
"https://api.360-search.com/?q="+
encodeQuery(query)+
"&type=image"+
"&safe=moderate"+
"&limit=12",
{
headers:{Accept:"application/json"},
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

const list=
Array.isArray(d.results)?
d.results:
[];

if(!list.length)return;

const grid=document.createElement("div");
grid.className="imageGrid";

for(const item of list){

const src=
item.image||
item.thumbnail;

if(!src)continue;

const img=document.createElement("img");

img.src=src;
img.alt=item.title||"";
img.loading="lazy";

img.onerror=()=>img.remove();

grid.appendChild(img);
}

if(grid.children.length){
images.appendChild(grid);
}

}catch(e){

console.debug("Images",e);
}
}

function run(){

if(!query){

status.textContent=
"Enter a search query.";

return;
}

tracebreak();

wikipedia();
duckduckgo();

calculator();
conversion();
weather();

search360();
imageSearch();
you();

updateStatus();
}

run();
</script>

</body>
</html>
